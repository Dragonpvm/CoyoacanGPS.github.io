<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Coyoacan GPS</title>

<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   APP
   ========================================================= */

.app {
    position: relative;

    width: 100%;
    height: 100dvh;

    overflow: hidden;

    background: #000;
}


/* =========================================================
   CÁMARA
   ========================================================= */

#video-stream {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #111;

    z-index: 1;
}


/* =========================================================
   TARJETA GPS
   ========================================================= */

.gps-overlay-box {

    position: absolute;

    z-index: 10;

    left: 3%;
    right: 3%;

    bottom: 1.7%;

    height: 22%;

    min-height: 190px;

    background: rgba(67, 73, 78, 0.93);

    border: 1px solid rgba(255,255,255,0.65);

    box-shadow:
        0 2px 8px rgba(0,0,0,0.25);

    display: flex;

    flex-direction: column;

    color: #fff;

    overflow: hidden;
}


/* =========================================================
   ENCABEZADO
   ========================================================= */

.header-row {

    height: 27%;

    min-height: 54px;

    width: 100%;

    display: flex;

    align-items: center;

    padding: 0 10px;

    border-bottom:
        1px solid rgba(255,255,255,0.12);

    white-space: nowrap;
}


/* =========================================================
   MARCA
   ========================================================= */

.brand-title {

    display: flex;

    align-items: center;

    color: #fff;

    font-size: clamp(12px, 2.2vw, 17px);

    font-weight: 700;

    flex-shrink: 0;
}


.brand-square {

    width: 18px;
    height: 18px;

    margin-right: 6px;

    background: #fbc02d;

    border-radius: 2px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    color: #fff;

    font-size: 10px;
}


/* =========================================================
   CIUDAD
   ========================================================= */

.city-title {

    margin-left: auto;

    color: #fff;

    font-size: clamp(16px, 3vw, 24px);

    font-weight: 700;

    text-align: right;

    white-space: nowrap;
}


/* =========================================================
   CONTENIDO
   ========================================================= */

.content-row {

    flex: 1;

    display: flex;

    align-items: center;

    padding: 10px 8px;

    gap: 10px;

    min-height: 0;
}


/* =========================================================
   CUADRO BLANCO
   ========================================================= */

.map-container {

    width: 26%;

    max-width: 176px;

    aspect-ratio: 1 / 1;

    min-width: 120px;

    background: #fff;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}


/* =========================================================
   PIN
   ========================================================= */

.map-pin {

    position: relative;

    width: 57%;

    height: 72%;
}


/*
   Círculo rojo
*/

.map-pin::before {

    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 70%;

    background: #ea4335;

    border-radius: 50%;
}


/*
   Punta del pin
*/

.map-pin::after {

    content: "";

    position: absolute;

    left: 18%;

    top: 48%;

    width: 64%;
    height: 52%;

    background: #78909c;

    clip-path: polygon(
        35% 0,
        65% 0,
        50% 100%
    );
}


/*
   Centro blanco
*/

.pin-center {

    position: absolute;

    z-index: 2;

    width: 38%;

    aspect-ratio: 1;

    left: 31%;

    top: 16%;

    background: #fff;

    border-radius: 50%;
}


/* =========================================================
   DATOS
   ========================================================= */

.data-container {

    flex: 1;

    height: 100%;

    min-width: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    gap: 3px;

    overflow: hidden;
}


/* Dirección */

.address-line {

    color: #eeeeee;

    font-size: clamp(12px, 2.1vw, 17px);

    line-height: 1.25;

    white-space: nowrap;
}


/* Coordenadas */

.coords-line {

    color: #dddddd;

    font-size: clamp(12px, 2vw, 16px);

    line-height: 1.3;

    margin-top: 4px;

    white-space: nowrap;
}


/* Fecha */

.datetime-line {

    color: #fff;

    font-size: clamp(12px, 2vw, 16px);

    line-height: 1.3;

    font-weight: 700;

    margin-top: 4px;

    white-space: nowrap;
}


/* Pie */

.footer-line {

    color: #dddddd;

    font-size: clamp(11px, 1.9vw, 15px);

    line-height: 1.3;

    margin-top: 3px;

    white-space: nowrap;
}


/* =========================================================
   BOTÓN CAPTURA
   ========================================================= */

.capture-button {

    position: absolute;

    z-index: 30;

    bottom: 25px;

    left: 50%;

    transform: translateX(-50%);

    width: 70px;
    height: 70px;

    border-radius: 50%;

    background: #fff;

    border: 5px solid #e63946;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.5);

    display: none;
}


/* =========================================================
   PREVIEW
   ========================================================= */

#preview-modal {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    background: #000;

    flex-direction: column;
}


#preview-img {

    width: 100%;

    height: calc(100% - 90px);

    object-fit: contain;

    background: #000;
}


.preview-actions {

    height: 90px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 20px;

    background: #0a0a0a;
}


.btn {

    border: none;

    border-radius: 8px;

    padding: 12px 18px;

    color: #fff;

    font-size: 14px;

    font-weight: 600;
}


.btn-discard {

    background: #333;
}


.btn-save {

    background: #e63946;
}

</style>
</head>


<body>


<div class="app">

    <!-- =====================================================
         CÁMARA
         ===================================================== -->

    <video
        id="video-stream"
        autoplay
        playsinline
        muted>
    </video>


    <!-- =====================================================
         TARJETA GPS
         ===================================================== -->

    <div class="gps-overlay-box">


        <!-- ENCABEZADO -->

        <div class="header-row">

            <div class="brand-title">

                <span class="brand-square">
                    ★
                </span>

                Coyoacan GPS

            </div>


            <div class="city-title">

                CMDX, Ciudad de Mexico, Mexico

            </div>

        </div>


        <!-- CONTENIDO -->

        <div class="content-row">


            <!-- MAPA -->

            <div class="map-container">

                <div class="map-pin">

                    <div class="pin-center"></div>

                </div>

            </div>


            <!-- INFORMACIÓN -->

            <div class="data-container">

                <div class="address-line">

                    Calle Centenario 123, Del Carmen,

                </div>


                <div class="address-line">

                    Coyoacan

                </div>


                <div class="coords-line">

                    Lat 19.351234, Long -99.165678

                </div>


                <div
                    class="datetime-line"
                    id="live-clock">

                    14/09/2026 08:40 a.m.

                </div>


                <div class="footer-line">

                    Foto tomada por Coyoacan GPS

                </div>

            </div>

        </div>

    </div>


    <!-- BOTÓN DE CAPTURA -->

    <button
        class="capture-button"
        onclick="takeSnapshot()">
    </button>

</div>


<!-- =========================================================
     PREVISUALIZACIÓN
     ========================================================= -->

<div id="preview-modal">

    <img
        id="preview-img"
        alt="Evidencia">


    <div class="preview-actions">

        <button
            class="btn btn-discard"
            onclick="discardPhoto()">

            ❌ Descartar

        </button>


        <button
            class="btn btn-save"
            onclick="downloadPhoto()">

            💾 Guardar Evidencia

        </button>

    </div>

</div>


<canvas
    id="canvas"
    style="display:none">
</canvas>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const video =
    document.getElementById("video-stream");

const clockEl =
    document.getElementById("live-clock");

let fileName = "";


/* =========================================================
   RELOJ
   ========================================================= */

function updateClock() {

    const now = new Date();

    const date =
        now.toLocaleDateString(
            "es-MX",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );


    const time =
        now.toLocaleTimeString(
            "es-MX",
            {
                hour: "2-digit",
                minute: "2-digit",
                hour12: true
            }
        );


    clockEl.textContent =
        `${date} ${time}`;
}


updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================
   CÁMARA
   ========================================================= */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }

                },

                audio: false

            });


        video.srcObject = stream;

    } catch (error) {

        console.error(
            "No se pudo abrir la cámara:",
            error
        );

        try {

            const stream =
                await navigator.mediaDevices
                .getUserMedia({
                    video: true,
                    audio: false
                });

            video.srcObject = stream;

        } catch (error2) {

            console.error(
                "Cámara no disponible:",
                error2
            );

        }

    }
}


startCamera();


/* =========================================================
   TOMAR FOTO
   ========================================================= */

function takeSnapshot() {

    const canvas =
        document.getElementById("canvas");

    const ctx =
        canvas.getContext("2d");


    const videoWidth =
        video.videoWidth || 720;

    const videoHeight =
        video.videoHeight || 1280;


    canvas.width =
        videoWidth;

    canvas.height =
        videoHeight;


    /* -----------------------------------------------------
       FONDO
       ----------------------------------------------------- */

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* -----------------------------------------------------
       ESCALA BASADA EN LA IMAGEN DE REFERENCIA
       ----------------------------------------------------- */

    const w = canvas.width;
    const h = canvas.height;


    /*
       En la referencia:

       margen izquierdo ≈ 3%
       margen derecho ≈ 3%
       tarjeta ≈ 22% de la altura
    */

    const marginX =
        w * 0.03;

    const cardW =
        w - marginX * 2;

    const cardH =
        h * 0.22;

    const cardY =
        h * 0.765;


    /* -----------------------------------------------------
       TARJETA
       ----------------------------------------------------- */

    ctx.fillStyle =
        "rgba(67,73,78,0.93)";

    ctx.fillRect(
        marginX,
        cardY,
        cardW,
        cardH
    );


    ctx.strokeStyle =
        "rgba(255,255,255,0.65)";

    ctx.lineWidth = 2;

    ctx.strokeRect(
        marginX,
        cardY,
        cardW,
        cardH
    );


    /* -----------------------------------------------------
       ENCABEZADO
       ----------------------------------------------------- */

    const headerH =
        cardH * 0.27;


    ctx.strokeStyle =
        "rgba(255,255,255,0.12)";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(
        marginX,
        cardY + headerH
    );

    ctx.lineTo(
        marginX + cardW,
        cardY + headerH
    );

    ctx.stroke();


    /* -----------------------------------------------------
       MAPA
       ----------------------------------------------------- */

    const mapSize =
        cardH * 0.62;

    const mapX =
        marginX + 8;

    const mapY =
        cardY +
        headerH +
        (cardH - headerH - mapSize) / 2;


    ctx.fillStyle = "#fff";

    ctx.fillRect(
        mapX,
        mapY,
        mapSize,
        mapSize
    );


    /* -----------------------------------------------------
       PIN
       ----------------------------------------------------- */

    const pinCX =
        mapX + mapSize / 2;

    const pinRadius =
        mapSize * 0.17;

    const pinCY =
        mapY + mapSize * 0.37;


    /* círculo */

    ctx.fillStyle =
        "#EA4335";

    ctx.beginPath();

    ctx.arc(
        pinCX,
        pinCY,
        pinRadius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* punta */

    ctx.beginPath();

    ctx.moveTo(
        pinCX - pinRadius,
        pinCY + pinRadius * 0.25
    );

    ctx.lineTo(
        pinCX,
        mapY + mapSize * 0.80
    );

    ctx.lineTo(
        pinCX + pinRadius,
        pinCY + pinRadius * 0.25
    );

    ctx.closePath();

    ctx.fill();


    /* centro blanco */

    ctx.fillStyle =
        "#fff";

    ctx.beginPath();

    ctx.arc(
        pinCX,
        pinCY,
        pinRadius * 0.43,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* -----------------------------------------------------
       TEXTOS
       ----------------------------------------------------- */

    const textX =
        mapX + mapSize + 12;

    const fontSize =
        w * 0.021;


    let y =
        cardY + headerH * 0.63;


    /* marca */

    ctx.fillStyle =
        "#fbc02d";

    ctx.fillRect(
        marginX + 9,
        cardY + 9,
        16,
        16
    );


    ctx.fillStyle =
        "#fff";

    ctx.font =
        `bold ${fontSize * 0.95}px Arial`;

    ctx.fillText(
        "Coyoacan GPS",
        marginX + 32,
        cardY + 21
    );


    /* ciudad */

    ctx.textAlign =
        "right";

    ctx.font =
        `bold ${fontSize * 1.25}px Arial`;

    ctx.fillText(
        "CMDX, Ciudad de Mexico, Mexico",
        marginX + cardW - 10,
        cardY + 22
    );


    ctx.textAlign =
        "left";


    /* dirección */

    ctx.font =
        `${fontSize}px Arial`;

    ctx.fillStyle =
        "#eeeeee";


    y =
        mapY + mapSize * 0.20;


    ctx.fillText(
        "Calle Centenario 123, Del Carmen,",
        textX,
        y
    );


    y +=
        mapSize * 0.19;


    ctx.fillText(
        "Coyoacan",
        textX,
        y
    );


    /* coordenadas */

    y +=
        mapSize * 0.20;

    ctx.fillStyle =
        "#dddddd";

    ctx.fillText(
        "Lat 19.351234, Long -99.165678",
        textX,
        y
    );


    /* fecha */

    y +=
        mapSize * 0.21;

    ctx.fillStyle =
        "#fff";

    ctx.font =
        `bold ${fontSize}px Arial`;

    const now =
        new Date();


    const date =
        now.toLocaleDateString(
            "es-MX",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );


    const time =
        now.toLocaleTimeString(
            "es-MX",
            {
                hour: "2-digit",
                minute: "2-digit",
                hour12: true
            }
        );


    ctx.fillText(
        `${date} ${time}`,
        textX,
        y
    );


    /* pie */

    y +=
        mapSize * 0.17;

    ctx.font =
        `${fontSize * 0.90}px Arial`;

    ctx.fillStyle =
        "#dddddd";

    ctx.fillText(
        "Foto tomada por Coyoacan GPS",
        textX,
        y
    );


    /* -----------------------------------------------------
       NOMBRE DEL ARCHIVO
       ----------------------------------------------------- */

    fileName =
        `Evidencia_${now
            .toISOString()
            .replace(/[:.]/g, "-")
        }.jpg`;


    /* -----------------------------------------------------
       MOSTRAR FOTO
       ----------------------------------------------------- */

    document
        .getElementById("preview-img")
        .src =
        canvas.toDataURL(
            "image/jpeg",
            0.95
        );


    document
        .getElementById("preview-modal")
        .style.display =
        "flex";
}


/* =========================================================
   DESCARTAR
   ========================================================= */

function discardPhoto() {

    document
        .getElementById("preview-modal")
        .style.display =
        "none";
}


/* =========================================================
   GUARDAR
   ========================================================= */

function downloadPhoto() {

    const a =
        document.createElement("a");

    a.href =
        document
        .getElementById("preview-img")
        .src;

    a.download =
        fileName;

    a.click();

    discardPhoto();
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Coyoacán GPS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body { 
      width: 100%; 
      height: 100dvh; 
      background: #000; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      overflow: hidden; 
    }
    
    .app-viewport { 
      display: flex; 
      flex-direction: column; 
      width: 100%; 
      height: 100dvh; 
    }
    
    .camera-container { 
      position: relative; 
      flex: 1; 
      width: 100%; 
      background: #000; 
      overflow: hidden; 
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    
    /* CAJA GPS EXACTA DE LA FOTO 1 */
    .gps-overlay-box {
      position: absolute; 
      bottom: 16px; 
      left: 12px; 
      right: 12px;
      background: rgba(10, 10, 10, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 10;
      box-shadow: 0 4px 18px rgba(0,0,0,0.7);
    }

    /* CONTENEDOR DE PIN DEL MAPA */
    .map-container {
      width: 96px;
      height: 96px;
      min-width: 96px;
      background: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-pin-svg {
      width: 52px;
      height: 64px;
    }

    /* COLUMNA DE DATOS */
    .data-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: #ffffff;
    }

    .brand-line {
      font-size: 11px;
      font-weight: 700;
      color: #dedede;
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.5px;
    }

    .brand-square {
      width: 9px;
      height: 9px;
      background: #fbc02d;
      border-radius: 1px;
      display: inline-block;
    }

    .city-line {
      font-weight: 800;
      color: #ffffff;
      font-size: 14.5px;
      line-height: 1.2;
      margin-top: 1px;
    }

    .address-line {
      color: #e0e0e0;
      font-size: 11.5px;
      font-weight: 400;
      line-height: 1.2;
    }

    .coords-line {
      color: #b0b0b0;
      font-size: 10.5px;
      margin-top: 1px;
    }

    .datetime-line {
      font-weight: 700;
      color: #ffffff;
      font-size: 11.5px;
      margin-top: 1px;
    }

    /* PANEL DE CONTROL INFERIOR */
    .controls-panel { 
      height: 95px; 
      min-height: 95px;
      background: #000000; 
      display: flex; 
      justify-content: space-evenly; 
      align-items: center; 
      border-top: 1px solid #1a1a1a;
      z-index: 20;
    }
    
    .btn-side { 
      background: #1c1c1e; 
      color: #fff; 
      border: 1px solid #2c2c2e; 
      padding: 10px 18px; 
      border-radius: 10px; 
      font-size: 0.85rem; 
      font-weight: 600; 
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    
    .btn-capture { 
      width: 68px; 
      height: 68px; 
      border-radius: 50%; 
      background: #ffffff; 
      border: 4px solid #e63946; 
      cursor: pointer; 
    }

    /* MODAL DE VISTA PREVIA */
    #preview-modal { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: #000; 
      z-index: 100; 
      flex-direction: column; 
    }
    
    #preview-img { 
      width: 100%; 
      flex: 1; 
      object-fit: contain; 
      background: #000; 
    }
    
    .preview-actions { 
      height: 85px; 
      background: #000000; 
      display: flex; 
      justify-content: space-evenly; 
      align-items: center; 
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="camera-container">
      <video id="video-stream" autoplay playsinline muted></video>
      
      <!-- CUADRO FLOTANTE -->
      <div class="gps-overlay-box" id="overlay-card">
        <div class="map-container">
          <svg class="map-pin-svg" viewBox="0 0 100 130" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 0C22.4 0 0 22.4 0 50C0 87.5 50 130 50 130C50 130 100 87.5 100 50C100 22.4 77.6 0 50 0Z" fill="#EA4335"/>
            <ellipse cx="50" cy="48" rx="18" ry="18" fill="#B31412"/>
            <rect x="47" y="85" width="6" height="35" fill="#5F6368" />
          </svg>
        </div>

        <div class="data-container">
          <div class="brand-line"><span class="brand-square"></span> COYOACAN GPS</div>
          <div class="city-line">CDMX, Ciudad de México, México</div>
          <div class="address-line">Calle Centenario 123, Del Carmen, Coyoacán</div>
          <div class="coords-line">Lat 19.351234, Long -99.165678</div>
          <div class="datetime-line" id="live-clock">14/9/2026, 9:27:27 a. m.</div>
        </div>
      </div>
    </div>

    <div class="controls-panel">
      <button class="btn-side">📹 Video</button>
      <button class="btn-capture" onclick="takeSnapshot()"></button>
      <button class="btn-side">🖼️ Galería</button>
    </div>
  </div>

  <div id="preview-modal">
    <img id="preview-img" alt="Evidencia">
    <div class="preview-actions">
      <button class="btn-side" style="background: #222;" onclick="discardPhoto()">❌ Descartar</button>
      <button class="btn-side" style="background: #e63946; border: none;" onclick="downloadPhoto()">💾 Guardar Evidencia</button>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video-stream');
    const clockEl = document.getElementById('live-clock');
    let fileName = '';

    function updateClock() {
      const now = new Date();
      const dateStr = `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}`;
      const timeStr = now.toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
      clockEl.innerText = `${dateStr}, ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
    }).catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true }).then(stream => video.srcObject = stream);
    });

    function drawRoundedRect(ctx, x, y, width, height, radius, fillStyle, strokeStyle) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      
      if (fillStyle) {
        ctx.fillStyle = fillStyle;
        ctx.fill();
      }
      if (strokeStyle) {
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    function takeSnapshot() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      const w = video.videoWidth || 1280;
      const h = video.videoHeight || 720;
      canvas.width = w;
      canvas.height = h;

      // 1. Imagen base
      ctx.drawImage(video, 0, 0, w, h);

      // 2. Proporciones y dimensiones ajustadas
      const margin = w * 0.03;
      const cardW = w - (margin * 2);
      const cardH = h * 0.19;
      const cardY = h - cardH - margin;
      const radius = 14;

      // Dibujar fondo transparente con esquinas redondeadas exactas
      drawRoundedRect(ctx, margin, cardY, cardW, cardH, radius, "rgba(10, 10, 10, 0.90)", "rgba(255, 255, 255, 0.25)");

      // 3. Cuadro Blanco del Mapa (Izquierda) con esquinas redondeadas
      const mapW = cardH * 0.74;
      const mapX = margin + 14;
      const mapY = cardY + (cardH - mapW) / 2;
      drawRoundedRect(ctx, mapX, mapY, mapW, mapW, 8, "#ffffff", null);

      // Pin dibujado en Canvas en vector limpio
      const pinW = mapW * 0.55;
      const pinH = mapW * 0.70;
      const pinX = mapX + (mapW - pinW) / 2;
      const pinY = mapY + (mapW - pinH) / 2;

      const centerX = pinX + (pinW / 2);
      const headRadius = pinW * 0.45;
      const headCenterY = pinY + headRadius;

      // Cuerpo pin rojo
      ctx.fillStyle = "#EA4335";
      ctx.beginPath();
      ctx.arc(centerX, headCenterY, headRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(centerX - headRadius, headCenterY + 2);
      ctx.lineTo(centerX, pinY + pinH - 10);
      ctx.lineTo(centerX + headRadius, headCenterY + 2);
      ctx.fill();

      // Centro del pin
      ctx.fillStyle = "#B31412";
      ctx.beginPath();
      ctx.arc(centerX, headCenterY, headRadius * 0.45, 0, Math.PI * 2);
      ctx.fill();

      // Aguja inferior
      ctx.fillStyle = "#5F6368";
      ctx.fillRect(centerX - 2, pinY + pinH - 12, 4, 12);

      // 4. Textos con fuentes idénticas a la pantalla
      const textX = mapX + mapW + 14;
      const baseFont = w * 0.021;
      const systemFont = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

      // Línea 1: Brand
      let currentY = mapY + (mapW * 0.16);
      ctx.fillStyle = "#fbc02d";
      ctx.fillRect(textX, currentY - (baseFont * 0.6), baseFont * 0.65, baseFont * 0.65);

      ctx.fillStyle = "#dedede";
      ctx.font = `700 ${baseFont * 0.8}px ${systemFont}`;
      ctx.fillText("COYOACAN GPS", textX + (baseFont * 0.95), currentY);

      // Línea 2: Ciudad
      currentY += (mapW * 0.22);
      ctx.fillStyle = "#ffffff";
      ctx.font = `800 ${baseFont * 1.25}px ${systemFont}`;
      ctx.fillText("CDMX, Ciudad de México, México", textX, currentY);

      // Línea 3: Dirección
      currentY += (mapW * 0.20);
      ctx.fillStyle = "#e0e0e0";
      ctx.font = `400 ${baseFont * 0.95}px ${systemFont}`;
      ctx.fillText("Calle Centenario 123, Del Carmen, Coyoacán", textX, currentY);

      // Línea 4: Coordenadas
      currentY += (mapW * 0.17);
      ctx.fillStyle = "#b0b0b0";
      ctx.font = `400 ${baseFont * 0.85}px ${systemFont}`;
      ctx.fillText("Lat 19.351234, Long -99.165678", textX, currentY);

      // Línea 5: Fecha / Hora exacta
      currentY += (mapW * 0.19);
      ctx.fillStyle = "#ffffff";
      ctx.font = `700 ${baseFont * 0.95}px ${systemFont}`;
      ctx.fillText(clockEl.innerText, textX, currentY);

      // Descarga / Vista previa
      const now = new Date();
      fileName = `Evidencia_${now.toISOString().replace(/[:.]/g, '-')}.jpg`;
      document.getElementById('preview-img').src = canvas.toDataURL('image/jpeg', 0.95);
      document.getElementById('preview-modal').style.display = 'flex';
    }

    function discardPhoto() {
      document.getElementById('preview-modal').style.display = 'none';
    }

    function downloadPhoto() {
      const a = document.createElement('a');
      a.href = document.getElementById('preview-img').src;
      a.download = fileName;
      a.click();
      discardPhoto();
    }
  </script>
</body>
</html>

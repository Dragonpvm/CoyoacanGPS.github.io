<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coyoacán GPS Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100vh; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; }
    
    /* Layout Principal */
    .app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    
    /* Vista de Cámara */
    .camera-view { relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; position: relative; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* Banner GPS Legible */
    .gps-banner {
      position: absolute; bottom: 12px; left: 12px; right: 12px;
      background: rgba(0, 0, 0, 0.85); border-radius: 12px; padding: 14px;
      display: flex; align-items: center; gap: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .gps-pin { width: 42px; height: 42px; background: #e63946; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .gps-info { font-size: 13px; line-height: 1.4; color: #eee; }
    .gps-info strong { font-size: 16px; color: #fff; display: block; margin-bottom: 2px; }
    
    /* Controles Inferiores Visibles (GPS Map Camera Style) */
    .controls-bar { height: 110px; background: #121212; display: flex; justify-content: space-around; align-items: center; padding: 0 10px; flex-shrink: 0; border-top: 1px solid #222; }
    .btn-action { background: #252525; color: #fff; border: 1px solid #444; padding: 12px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .btn-trigger { width: 72px; height: 72px; border-radius: 50%; background: #fff; border: 5px solid #e63946; cursor: pointer; outline: none; }
    .btn-trigger:active { transform: scale(0.95); background: #ddd; }

    /* Visor de Previsualización */
    #preview-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 999; flex-direction: column; }
    #preview-img { width: 100%; flex: 1; object-fit: contain; background: #000; }
    .preview-bar { height: 90px; background: #121212; display: flex; justify-content: space-evenly; align-items: center; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- CÁMARA + BANNER EN VIVO -->
    <div class="camera-view">
      <video id="video-stream" autoplay playsinline muted></video>
      
      <div class="gps-banner">
        <div class="gps-pin">📍</div>
        <div class="gps-info">
          <strong>Coyoacán GPS</strong>
          CDMX, Ciudad de México, México<br>
          Calle Centenario 123, Del Carmen, Coyoacán<br>
          Lat 19.351234, Long -99.165678<br>
          <span id="live-clock" style="color: #4cc9f0; font-weight: 600;">Cargando fecha...</span>
        </div>
      </div>
    </div>

    <!-- CONTROLES INFERIORES FIJOS -->
    <div class="controls-bar">
      <button class="btn-action" onclick="alert('Modo video en desarrollo')">📹 Video</button>
      <button class="btn-trigger" onclick="takeSnapshot()"></button>
      <button class="btn-action" onclick="alert('Abre las descargas de tu teléfono')">🖼️ Galería</button>
    </div>
  </div>

  <!-- VISOR DE LA FOTO CAPTURADA -->
  <div id="preview-modal">
    <img id="preview-img" alt="Evidencia">
    <div class="preview-bar">
      <button class="btn-action" style="background: #333;" onclick="discardPhoto()">❌ Descartar</button>
      <button class="btn-action" style="background: #e63946; border: none;" onclick="downloadPhoto()">💾 Guardar Evidencia</button>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video-stream');
    const clockEl = document.getElementById('live-clock');
    let fileName = '';

    // Reloj en tiempo real
    function updateClock() {
      const now = new Date();
      clockEl.innerText = now.toLocaleString('es-MX');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Activar Cámara Trasera
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
    }).catch(err => {
      navigator.mediaDevices.getUserMedia({ video: true }).then(stream => video.srcObject = stream);
    });

    // Capturar foto y estampar datos
    function takeSnapshot() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;

      // 1. Dibujar Foto
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // 2. Dibujar Banner Proporcional
      const margin = canvas.width * 0.03;
      const bannerHeight = 160;
      const bannerWidth = canvas.width - (margin * 2);
      const bannerY = canvas.height - bannerHeight - margin;

      ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
      ctx.roundRect(margin, bannerY, bannerWidth, bannerHeight, 16);
      ctx.fill();

      // Textos HD
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 26px sans-serif";
      ctx.fillText("Coyoacán GPS", margin + 25, bannerY + 40);
      
      ctx.font = "18px sans-serif";
      ctx.fillStyle = "#dddddd";
      ctx.fillText("CDMX, Ciudad de México, México - Calle Centenario 123", margin + 25, bannerY + 72);
      ctx.fillText("Lat 19.351234, Long -99.165678", margin + 25, bannerY + 102);
      
      const now = new Date();
      fileName = `Evidencia_${now.toISOString().replace(/[:.]/g, '-')}.jpg`;
      ctx.fillStyle = "#4cc9f0";
      ctx.fillText(now.toLocaleString('es-MX'), margin + 25, bannerY + 132);

      // 3. Mostrar Vista Previa
      document.getElementById('preview-img').src = canvas.toDataURL('image/jpeg', 0.95);
      document.getElementById('preview-modal').style.display = 'flex';
    }

    function discardPhoto() {
      document.getElementById('preview-modal').style.display = 'none';
    }

    function downloadPhoto() {
      const a = document.createElement('a');
      a.href = document.getElementById('preview-img').src;
      a.download = fileName;
      a.click();
      discardPhoto();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Coyoacán GPS Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    
    /* Contenedor de la cámara en vivo */
    #camera-container { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #111; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* Banner Overlay sobre la cámara en vivo */
    .gps-banner {
      position: absolute; bottom: 15px; left: 15px; right: 15px;
      background: rgba(0, 0, 0, 0.75); border-radius: 12px; padding: 12px;
      display: flex; align-items: center; gap: 12px; backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .gps-pin { width: 36px; height: 36px; background: #e63946; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
    .gps-info { font-size: 11px; line-height: 1.4; color: #ddd; }
    .gps-info strong { font-size: 13px; color: #fff; display: block; }
    
    /* Panel de controles inferior (Estilo GPS Map Camera) */
    .controls { height: 100px; background: #0d0d0d; display: flex; justify-content: space-around; align-items: center; padding: 0 20px; }
    .btn-capture { width: 65px; height: 65px; border-radius: 50%; background: #fff; border: 4px solid #e63946; cursor: pointer; }
    .btn-secondary { background: #222; color: #fff; border: 1px solid #444; padding: 10px 15px; border-radius: 8px; font-size: 12px; }

    /* Modal de Previsualización */
    #preview-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 100; flex-direction: column; }
    #preview-img { flex: 1; object-fit: contain; }
    .preview-actions { height: 80px; background: #111; display: flex; justify-content: space-evenly; align-items: center; }
  </style>
</head>
<body>

  <!-- 1. VISTA PREVIA DE CÁMARA EN VIVO + BANNER -->
  <div id="camera-container">
    <video id="video-stream" autoplay playsinline></video>
    
    <!-- Banner incrustado en pantalla -->
    <div class="gps-banner">
      <div class="gps-pin">📍</div>
      <div class="gps-info">
        <strong>Coyoacán GPS</strong>
        CDMX, Ciudad de México, México<br>
        Calle Centenario 123, Del Carmen, Coyoacán<br>
        Lat 19.351234, Long -99.165678<br>
        <span id="live-clock">Cargando fecha...</span>
      </div>
    </div>
  </div>

  <!-- 2. BARRA DE CONTROLES INFERIOR -->
  <div class="controls">
    <button class="btn-secondary" onclick="alert('Funcionalidad de video')">📹 Video</button>
    <button class="btn-capture" onclick="takeSnapshot()"></button>
    <button class="btn-secondary" onclick="alert('Galería local')">🖼️ Galería</button>
  </div>

  <!-- 3. PREVISUALIZACIÓN DE LA FOTO CAPTURADA -->
  <div id="preview-modal">
    <img id="preview-img" alt="Evidencia capturada">
    <div class="preview-actions">
      <button class="btn-secondary" onclick="discardPhoto()">❌ Descartar</button>
      <button class="btn-secondary" style="background:#e63946;" onclick="downloadPhoto()">💾 Guardar Evidencia</button>
    </div>
  </div>

  <!-- Elemento oculto para procesar la imagen con el texto integrado -->
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video-stream');
    const clockEl = document.getElementById('live-clock');
    let capturedBlob = null;
    let fileName = '';

    // Reloj en tiempo real
    function updateClock() {
      const now = new Date();
      clockEl.innerText = now.toLocaleString('es-MX');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Activar la cámara del teléfono (Cámara trasera)
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: "environment" } },
      audio: false
    }).catch(() => {
      // Si falla la cámara trasera (ej. en laptops), abre la cámara por defecto
      return navigator.mediaDevices.getUserMedia({ video: true });
    }).then(stream => {
      video.srcObject = stream;
    });

    // Capturar la imagen y "quemar" los datos en el lienzo
    function takeSnapshot() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;

      // 1. Dibujar la foto de la cámara
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // 2. Dibujar el Banner de datos en la esquina inferior
      const margin = 20;
      const bannerHeight = 120;
      const bannerWidth = canvas.width - (margin * 2);
      const bannerY = canvas.height - bannerHeight - margin;

      // Fondo del banner
      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.roundRect(margin, bannerY, bannerWidth, bannerHeight, 15);
      ctx.fill();

      // Textos de evidencia
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 20px sans-serif";
      ctx.fillText("Coyoacán GPS", margin + 20, bannerY + 30);
      
      ctx.font = "14px sans-serif";
      ctx.fillStyle = "#dddddd";
      ctx.fillText("CDMX, Ciudad de México, México - Calle Centenario 123", margin + 20, bannerY + 55);
      ctx.fillText("Lat 19.351234, Long -99.165678", margin + 20, bannerY + 78);
      
      const now = new Date();
      const timeStr = now.toISOString().replace(/[:.]/g, '-');
      fileName = `Evidencia_${timeStr}.jpg`;
      ctx.fillText(now.toLocaleString('es-MX'), margin + 20, bannerY + 101);

      // 3. Mostrar la previsualización antes de descargar
      const dataUrl = canvas.toDataURL('image/jpeg');
      document.getElementById('preview-img').src = dataUrl;
      document.getElementById('preview-modal').style.display = 'flex';
    }

    function discardPhoto() {
      document.getElementById('preview-modal').style.display = 'none';
    }

    function downloadPhoto() {
      const a = document.createElement('a');
      a.href = document.getElementById('preview-img').src;
      a.download = fileName;
      a.click();
      discardPhoto();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no,
           viewport-fit=cover"
>

<title>Coyoacán GPS</title>

<style>

/* ============================================================
   RESET
   ============================================================ */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}


/* ============================================================
   PÁGINA
   ============================================================ */

html,
body {
  width: 100%;
  height: 100%;

  background: #000;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  overflow: hidden;
}


/* ============================================================
   APLICACIÓN
   ============================================================ */

.app-viewport {

  width: 100%;
  height: 100dvh;

  display: flex;
  flex-direction: column;

  background: #000;
}


/* ============================================================
   CÁMARA
   ============================================================ */

.camera-container {

  position: relative;

  width: 100%;

  flex: 1;

  min-height: 0;

  background: #000;

  overflow: hidden;
}


video {

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}


/* ============================================================
   TARJETA GPS
   RESPONSIVE
   ============================================================ */

.gps-overlay-box {

  position: absolute;

  /*
   * Se adapta al teléfono.
   */
  left: 3.5vw;
  right: 3.5vw;

  bottom: max(12px, env(safe-area-inset-bottom));

  width: auto;

  /*
   * Altura proporcional al ancho.
   */
  min-height: clamp(125px, 23vw, 205px);

  padding: clamp(6px, 1.5vw, 10px);

  display: flex;

  gap: clamp(6px, 2vw, 12px);

  align-items: flex-start;

  background:
    rgba(55, 61, 67, 0.92);

  border:
    1px solid rgba(255,255,255,0.75);

  box-shadow:
    0 4px 15px rgba(0,0,0,0.6);

  z-index: 10;
}


/* ============================================================
   CUADRO BLANCO DEL MAPA
   ============================================================ */

.map-container {

  /*
   * El tamaño depende del ancho de pantalla.
   */
  width: clamp(82px, 22vw, 175px);

  aspect-ratio: 1 / 1;

  min-width: clamp(82px, 22vw, 175px);

  background: #fff;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  flex-shrink: 0;
}


/* ============================================================
   PIN
   ============================================================ */

.map-pin-icon {

  width: 62%;

  height: auto;

  display: block;
}


/* ============================================================
   DATOS
   ============================================================ */

.data-container {

  flex: 1;

  min-width: 0;

  display: flex;

  flex-direction: column;

  gap: clamp(1px, 0.5vw, 4px);

  color: #fff;

  overflow: hidden;
}


/* ============================================================
   ENCABEZADO
   ============================================================ */

.header-row {

  width: 100%;

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 5px;

  margin-bottom: 2px;
}


/* ============================================================
   COYOACAN GPS
   ============================================================ */

.brand-title {

  display: flex;

  align-items: center;

  gap: 4px;

  font-weight: 700;

  color: #fff;

  font-size:
    clamp(10px, 3.1vw, 18px);

  white-space: nowrap;
}


.brand-square {

  width:
    clamp(8px, 2.5vw, 14px);

  height:
    clamp(8px, 2.5vw, 14px);

  background: #fbc02d;

  border-radius: 2px;

  flex-shrink: 0;
}


/* ============================================================
   CIUDAD
   ============================================================ */

.city-title {

  font-weight: 700;

  color: #fff;

  font-size:
    clamp(9px, 3vw, 18px);

  text-align: right;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* ============================================================
   DIRECCIÓN
   ============================================================ */

.address-line {

  color: #e0e0e0;

  font-size:
    clamp(10px, 3vw, 18px);

  line-height: 1.25;
}


/* ============================================================
   COORDENADAS
   ============================================================ */

.coords-line {

  color: #ccc;

  font-size:
    clamp(9px, 2.8vw, 17px);

  line-height: 1.25;

  white-space: nowrap;
}


/* ============================================================
   FECHA / HORA
   ============================================================ */

.datetime-line {

  color: #fff;

  font-weight: 700;

  font-size:
    clamp(10px, 3vw, 18px);

  line-height: 1.25;

  white-space: nowrap;
}


/* ============================================================
   PIE
   ============================================================ */

.footer-line {

  color: #aaa;

  font-size:
    clamp(9px, 2.6vw, 16px);

  line-height: 1.25;

  white-space: nowrap;
}


/* ============================================================
   PANEL DE BOTONES
   ============================================================ */

.controls-panel {

  width: 100%;

  height:
    clamp(78px, 18vw, 105px);

  min-height:
    clamp(78px, 18vw, 105px);

  padding-bottom:
    env(safe-area-inset-bottom);

  background: #0a0a0a;

  display: flex;

  justify-content: space-evenly;

  align-items: center;

  border-top: 1px solid #222;

  z-index: 20;
}


/* ============================================================
   BOTONES LATERALES
   ============================================================ */

.btn-side {

  background: #1a1a1a;

  color: #fff;

  border: 1px solid #333;

  padding:
    clamp(7px, 2vw, 10px)
    clamp(10px, 3vw, 18px);

  border-radius: 8px;

  font-size:
    clamp(11px, 3vw, 15px);

  font-weight: 600;

  white-space: nowrap;
}


/* ============================================================
   BOTÓN CAPTURA
   ============================================================ */

.btn-capture {

  width:
    clamp(58px, 17vw, 72px);

  height:
    clamp(58px, 17vw, 72px);

  border-radius: 50%;

  background: #fff;

  border:
    clamp(3px, 1vw, 4px)
    solid
    #e63946;

  cursor: pointer;

  flex-shrink: 0;
}


/* ============================================================
   PREVISUALIZACIÓN
   ============================================================ */

#preview-modal {

  display: none;

  position: fixed;

  inset: 0;

  background: #000;

  z-index: 100;

  flex-direction: column;
}


#preview-img {

  width: 100%;

  flex: 1;

  min-height: 0;

  object-fit: contain;

  background: #000;
}


.preview-actions {

  width: 100%;

  height:
    clamp(75px, 18vw, 90px);

  background: #0a0a0a;

  display: flex;

  justify-content: space-evenly;

  align-items: center;

  padding-bottom:
    env(safe-area-inset-bottom);
}


/* ============================================================
   TELÉFONOS MUY PEQUEÑOS
   ============================================================ */

@media (max-width: 360px) {

  .gps-overlay-box {
    gap: 6px;
    padding: 6px;
  }

  .map-container {
    width: 78px;
    min-width: 78px;
  }

  .city-title {
    max-width: 145px;
  }
}


/* ============================================================
   TELÉFONOS GRANDES
   ============================================================ */

@media (min-width: 600px) {

  .gps-overlay-box {

    left: 20px;
    right: 20px;

    min-height: 170px;

  }

  .map-container {

    width: 150px;

    min-width: 150px;

  }

}

</style>
</head>


<body>


<div class="app-viewport">


  <!-- ========================================================
       CÁMARA
       ======================================================== -->

  <div class="camera-container">

    <video
      id="video-stream"
      autoplay
      playsinline
      muted>
    </video>


    <!-- ======================================================
         TARJETA GPS
         ====================================================== -->

    <div class="gps-overlay-box">


      <!-- PIN -->
      <div class="map-container">

        <svg
          class="map-pin-icon"
          viewBox="0 0 100 140"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >

          <path
            d="
              M50 0
              C22.4 0 0 22.4 0 50
              C0 87.5 50 140 50 140
              C50 140 100 87.5 100 50
              C100 22.4 77.6 0 50 0Z
            "
            fill="#EA4335"
          />

          <ellipse
            cx="50"
            cy="45"
            rx="20"
            ry="20"
            fill="#ffffff"
          />

        </svg>

      </div>


      <!-- DATOS -->

      <div class="data-container">


        <div class="header-row">

          <span class="brand-title">

            <span class="brand-square"></span>

            Coyoacan GPS

          </span>


          <span class="city-title">

            CMDX, Ciudad de Mexico, Mexico

          </span>

        </div>


        <div class="address-line">

          Calle Centenario 123, Del Carmen,

        </div>


        <div class="address-line">

          Coyoacan

        </div>


        <div class="coords-line">

          Lat 19.351234, Long -99.165678

        </div>


        <div
          class="datetime-line"
          id="live-clock"
        >

          14/09/2026 08:20 a.m.

        </div>


        <div class="footer-line">

          Foto tomada por Coyoacan GPS

        </div>


      </div>

    </div>

  </div>


  <!-- ========================================================
       BOTONES
       ======================================================== -->

  <div class="controls-panel">


    <button
      class="btn-side"
      onclick="alert('Opción de video')"
    >
      📹 Video
    </button>


    <button
      class="btn-capture"
      onclick="takeSnapshot()"
    >
    </button>


    <button
      class="btn-side"
      onclick="alert('Galería')"
    >
      🖼️ Galería
    </button>


  </div>

</div>


<!-- ==========================================================
     PREVIEW
     ========================================================== -->

<div id="preview-modal">


  <img
    id="preview-img"
    alt="Evidencia"
  >


  <div class="preview-actions">


    <button
      class="btn-side"
      style="background:#222;"
      onclick="discardPhoto()"
    >
      ❌ Descartar
    </button>


    <button
      class="btn-side"
      style="
        background:#e63946;
        border:none;
      "
      onclick="downloadPhoto()"
    >
      💾 Guardar Evidencia
    </button>


  </div>

</div>


<canvas
  id="canvas"
  style="display:none;">
</canvas>


<script>


/* ============================================================
   ELEMENTOS
   ============================================================ */

const video =
  document.getElementById("video-stream");

const clockEl =
  document.getElementById("live-clock");

let fileName = "";


/* ============================================================
   RELOJ
   ============================================================ */

function updateClock() {

  const now = new Date();

  const dateStr =
    now.toLocaleDateString(
      "es-MX",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }
    );

  const timeStr =
    now.toLocaleTimeString(
      "es-MX",
      {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      }
    );

  clockEl.innerText =
    `${dateStr} ${timeStr}`;

}


setInterval(updateClock, 1000);

updateClock();


/* ============================================================
   CÁMARA
   ============================================================ */

navigator.mediaDevices
  .getUserMedia({

    video: {

      facingMode: {
        ideal: "environment"
      },

      width: {
        ideal: 1920
      },

      height: {
        ideal: 1080
      }

    },

    audio: false

  })

  .then(stream => {

    video.srcObject = stream;

  })

  .catch(() => {

    navigator.mediaDevices
      .getUserMedia({
        video: true
      })

      .then(stream => {

        video.srcObject = stream;

      });

  });


/* ============================================================
   TOMAR FOTO
   ============================================================ */

function takeSnapshot() {

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");


  /*
   * ==========================================================
   * USAMOS UNA PROPORCIÓN VERTICAL
   *
   * No depende del tamaño físico del teléfono.
   * ==========================================================
   */

  const outputW = 800;

  const outputH = 1200;

  canvas.width = outputW;

  canvas.height = outputH;


  /* ==========================================================
     VIDEO
     ========================================================== */

  const videoW =
    video.videoWidth || 1920;

  const videoH =
    video.videoHeight || 1080;


  const targetRatio =
    outputW / outputH;

  const videoRatio =
    videoW / videoH;


  let sx;
  let sy;
  let sw;
  let sh;


  if (videoRatio > targetRatio) {

    sh = videoH;

    sw =
      videoH * targetRatio;

    sx =
      (videoW - sw) / 2;

    sy = 0;

  } else {

    sw = videoW;

    sh =
      videoW / targetRatio;

    sx = 0;

    sy =
      (videoH - sh) / 2;

  }


  /* ==========================================================
     FOTO
     ========================================================== */

  ctx.drawImage(
    video,
    sx,
    sy,
    sw,
    sh,
    0,
    0,
    outputW,
    outputH
  );


  /* ==========================================================
     TARJETA GPS
     ========================================================== */

  const margin =
    outputW * 0.035;


  const cardW =
    outputW - margin * 2;


  /*
   * 20% de la altura.
   */

  const cardH =
    outputH * 0.20;


  const cardY =
    outputH -
    cardH -
    margin;


  /* Fondo */

  ctx.fillStyle =
    "rgba(55,61,67,0.92)";


  ctx.fillRect(
    margin,
    cardY,
    cardW,
    cardH
  );


  /* Borde */

  ctx.strokeStyle =
    "rgba(255,255,255,0.75)";

  ctx.lineWidth = 2;

  ctx.strokeRect(
    margin,
    cardY,
    cardW,
    cardH
  );


  /* ==========================================================
     MAPA
     ========================================================== */

  const mapW =
    cardH * 0.76;


  const mapX =
    margin + 12;


  const mapY =
    cardY +
    (cardH - mapW) / 2;


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    mapX,
    mapY,
    mapW,
    mapW
  );


  /* ==========================================================
     PIN
     ========================================================== */

  const centerX =
    mapX + mapW / 2;


  const centerY =
    mapY + mapW * 0.38;


  const radius =
    mapW * 0.22;


  ctx.fillStyle =
    "#EA4335";


  ctx.beginPath();

  ctx.arc(
    centerX,
    centerY,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.moveTo(
    centerX - radius,
    centerY + 3
  );

  ctx.lineTo(
    centerX,
    mapY + mapW * 0.75
  );

  ctx.lineTo(
    centerX + radius,
    centerY + 3
  );

  ctx.closePath();

  ctx.fill();


  /* Centro blanco */

  ctx.fillStyle =
    "#ffffff";


  ctx.beginPath();

  ctx.arc(
    centerX,
    centerY,
    radius * 0.45,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* ==========================================================
     TEXTO
     ========================================================== */

  const textX =
    mapX +
    mapW +
    14;


  const fontSize =
    outputW * 0.021;


  let lineY =
    mapY +
    mapW * 0.16;


  /* Encabezado */

  ctx.fillStyle =
    "#fbc02d";


  ctx.fillRect(
    textX,
    lineY - 10,
    10,
    10
  );


  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    `bold ${fontSize * 1.05}px Arial`;


  ctx.textAlign =
    "left";


  ctx.fillText(
    "Coyoacan GPS",
    textX + 14,
    lineY
  );


  ctx.textAlign =
    "right";


  ctx.fillText(
    "CMDX, Ciudad de Mexico, Mexico",
    margin + cardW - 12,
    lineY
  );


  ctx.textAlign =
    "left";


  /* Dirección */

  lineY +=
    mapW * 0.20;


  ctx.font =
    `${fontSize}px Arial`;


  ctx.fillStyle =
    "#e0e0e0";


  ctx.fillText(
    "Calle Centenario 123, Del Carmen,",
    textX,
    lineY
  );


  lineY +=
    mapW * 0.18;


  ctx.fillText(
    "Coyoacan",
    textX,
    lineY
  );


  /* Coordenadas */

  lineY +=
    mapW * 0.18;


  ctx.fillStyle =
    "#cccccc";


  ctx.fillText(
    "Lat 19.351234, Long -99.165678",
    textX,
    lineY
  );


  /* Fecha */

  lineY +=
    mapW * 0.20;


  const now =
    new Date();


  fileName =
    `Evidencia_${now
      .toISOString()
      .replace(/[:.]/g, "-")}.jpg`;


  const dateStr =
    now.toLocaleDateString(
      "es-MX",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }
    );


  const timeStr =
    now.toLocaleTimeString(
      "es-MX",
      {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      }
    );


  ctx.font =
    `bold ${fontSize * 1.05}px Arial`;


  ctx.fillStyle =
    "#ffffff";


  ctx.fillText(
    `${dateStr} ${timeStr}`,
    textX,
    lineY
  );


  /* Pie */

  lineY +=
    mapW * 0.16;


  ctx.font =
    `${fontSize * 0.9}px Arial`;


  ctx.fillStyle =
    "#aaaaaa";


  ctx.fillText(
    "Foto tomada por Coyoacan GPS",
    textX,
    lineY
  );


  /* ==========================================================
     PREVIEW
     ========================================================== */

  document
    .getElementById("preview-img")
    .src =
    canvas.toDataURL(
      "image/jpeg",
      0.95
    );


  document
    .getElementById("preview-modal")
    .style.display =
    "flex";

}


/* ============================================================
   DESCARTAR
   ============================================================ */

function discardPhoto() {

  document
    .getElementById("preview-modal")
    .style.display =
    "none";

}


/* ============================================================
   GUARDAR
   ============================================================ */

function downloadPhoto() {

  const a =
    document.createElement("a");

  a.href =
    document
      .getElementById("preview-img")
      .src;

  a.download =
    fileName;

  a.click();

  discardPhoto();

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no,
           viewport-fit=cover"
>

<title>Coyoacán GPS</title>


<style>

/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;

  -webkit-tap-highlight-color: transparent;
}


html,
body {

  width: 100%;
  height: 100%;

  background: #000;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  overflow: hidden;
}


/* =========================================================
   APP
   ========================================================= */

.app-viewport {

  width: 100%;
  height: 100dvh;

  display: flex;
  flex-direction: column;

  background: #000;
}


/* =========================================================
   CÁMARA
   ========================================================= */

.camera-container {

  position: relative;

  width: 100%;

  flex: 1;
  min-height: 0;

  background: #000;

  overflow: hidden;
}


video {

  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;
}


/* =========================================================
   TARJETA GPS
   ========================================================= */

.gps-box {

  position: absolute;

  left: 3%;
  right: 3%;

  bottom: 2%;

  width: 94%;

  height: 20%;

  background:
    rgba(0, 0, 0, 0.78);

  border:
    1px solid
    rgba(255, 255, 255, 0.4);

  border-radius: 8px;

  padding: 2%;

  display: flex;

  gap: 2.5%;

  align-items: stretch;

  z-index: 10;

  backdrop-filter: blur(6px);

  box-shadow:
    0 4px 20px
    rgba(0,0,0,0.6);
}


/* =========================================================
   COLUMNA IZQUIERDA
   ========================================================= */

.gps-left {

  width: 25%;

  min-width: 0;

  display: flex;

  flex-direction: column;

  align-items: stretch;
}


/* =========================================================
   LOGO + COYOACAN GPS
   ========================================================= */

.gps-brand {

  width: 100%;

  height: 27%;

  display: flex;

  align-items: center;

  margin-bottom: 5%;
}


/* =========================================================
   LOGO
   ========================================================= */

.gps-logo {

  height: 100%;

  aspect-ratio: 1 / 1;

  background: #fff;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

  flex-shrink: 0;
}


/*
   Aquí puedes poner tu logo real:

   <img src="logo.png">

   Por ahora usamos el símbolo.
*/

.gps-logo span {

  font-size: 55%;

  color: #c79b38;

  line-height: 1;
}


/* =========================================================
   COYOACAN GPS
   ========================================================= */

.brand-title {

  height: 100%;

  flex: 1;

  min-width: 0;

  background: #000;

  color: #fff;

  display: flex;

  align-items: center;

  padding: 0 5%;

  font-size: clamp(10px, 2.8vw, 24px);

  font-weight: 700;

  white-space: nowrap;

  overflow: hidden;
}


/* =========================================================
   MAPA
   ========================================================= */

.map-square {

  width: 100%;

  flex: 1;

  min-height: 0;

  background: #fff;

  border-radius: 4px;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;
}


/* =========================================================
   PIN
   ========================================================= */

.map-pin {

  font-size: clamp(45px, 14vw, 130px);

  line-height: 1;
}


/* =========================================================
   COLUMNA DERECHA
   ========================================================= */

.info-column {

  flex: 1;

  min-width: 0;

  display: flex;

  flex-direction: column;

  gap: 2px;

  color: #fff;
}


/* =========================================================
   CIUDAD
   ========================================================= */

.city-title-large {

  width: 100%;

  background: #000;

  color: #fff;

  padding: 1% 2%;

  font-size:
    clamp(13px, 3.8vw, 30px);

  font-weight: 800;

  line-height: 1.15;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* =========================================================
   INFORMACIÓN
   ========================================================= */

.address-text {

  margin-top: 2%;

  background: #000;

  color: #fff;

  padding: 1% 2%;

  font-size:
    clamp(10px, 3vw, 23px);

  font-weight: 500;

  line-height: 1.2;
}


.coords-text {

  background: #000;

  color: #ccc;

  padding: 0 2%;

  font-size:
    clamp(9px, 2.7vw, 21px);

  line-height: 1.2;
}


.datetime-text {

  background: #000;

  color: #fff;

  padding: 0 2%;

  font-size:
    clamp(10px, 2.9vw, 22px);

  font-weight: 700;

  line-height: 1.2;
}


.watermark-text {

  position: absolute;

  opacity: 0;

  pointer-events: none;
}


/* =========================================================
   BOTONES
   ========================================================= */

.controls-panel {

  width: 100%;

  height: 95px;

  min-height: 95px;

  background: #0a0a0a;

  display: flex;

  justify-content: space-evenly;

  align-items: center;

  border-top: 1px solid #222;

  z-index: 20;
}


.btn-side {

  background: #1a1a1a;

  color: #fff;

  border: 1px solid #333;

  padding: 9px 15px;

  border-radius: 8px;

  font-size: 0.8rem;

  font-weight: 600;

  cursor: pointer;
}


.btn-capture {

  width: 66px;

  height: 66px;

  border-radius: 50%;

  background: #fff;

  border: 4px solid #e63946;

  cursor: pointer;
}


/* =========================================================
   PREVIEW
   ========================================================= */

#preview-modal {

  display: none;

  position: fixed;

  inset: 0;

  background: #000;

  z-index: 100;

  flex-direction: column;
}


#preview-img {

  width: 100%;

  height: auto;

  flex: 1;

  min-height: 0;

  object-fit: contain;

  background: #000;
}


.preview-actions {

  width: 100%;

  height: 85px;

  min-height: 85px;

  background: #0a0a0a;

  display: flex;

  justify-content: space-evenly;

  align-items: center;
}


/* =========================================================
   TELÉFONOS PEQUEÑOS
   ========================================================= */

@media (max-width: 380px) {

  .gps-box {

    left: 3%;
    right: 3%;

    padding: 2%;

    gap: 2%;
  }

  .gps-left {

    width: 27%;
  }

  .brand-title {

    font-size: 10px;

    padding-left: 4%;
  }

  .city-title-large {

    font-size: 13px;
  }

  .address-text {

    font-size: 10px;
  }

  .coords-text {

    font-size: 9px;
  }

  .datetime-text {

    font-size: 10px;
  }
}


/* =========================================================
   TELÉFONOS GRANDES
   ========================================================= */

@media (min-width: 600px) {

  .gps-box {

    left: 20px;
    right: 20px;

    width: auto;

    height: 190px;

    bottom: 20px;
  }

  .gps-left {

    width: 170px;
  }

}

</style>

</head>


<body>


<!-- =========================================================
     APP
     ========================================================= -->

<div class="app-viewport">


  <!-- =======================================================
       CÁMARA
       ======================================================= -->

  <div class="camera-container">


    <video
      id="video-stream"
      autoplay
      playsinline
      muted>
    </video>


    <!-- =====================================================
         GPS
         ESTA ES LA ESTRUCTURA ÚNICA
         ===================================================== -->

    <div class="gps-box">


      <!-- =================================================
           IZQUIERDA
           ================================================= -->

      <div class="gps-left">


        <!-- LOGO + COYOACAN GPS -->

        <div class="gps-brand">


          <div class="gps-logo">

            <span>☀</span>

          </div>


          <div class="brand-title">

            Coyoacan GPS

          </div>


        </div>


        <!-- MAPA -->

        <div class="map-square">

          <span class="map-pin">📍</span>

        </div>


      </div>


      <!-- =================================================
           DERECHA
           ================================================= -->

      <div class="info-column">


        <!-- CIUDAD -->

        <div class="city-title-large">

          CDMX, Ciudad de México, México

        </div>


        <!-- DIRECCIÓN -->

        <div class="address-text">

          Calle Centenario 123, Del Carmen, Coyoacán

        </div>


        <!-- COORDENADAS -->

        <div class="coords-text">

          Lat 19.351234, Long -99.165678

        </div>


        <!-- FECHA -->

        <div
          class="datetime-text"
          id="live-clock"
        >

          14/09/2026, 9:25:17 a.m.

        </div>


      </div>


    </div>


  </div>


  <!-- =======================================================
       CONTROLES
       ======================================================= -->

  <div class="controls-panel">


    <button
      class="btn-side"
      onclick="alert('Modo video')"
    >
      📹 Video
    </button>


    <button
      class="btn-capture"
      onclick="takeSnapshot()"
    >
    </button>


    <button
      class="btn-side"
      onclick="alert('Galería')"
    >
      🖼️ Galería
    </button>


  </div>


</div>


<!-- =========================================================
     PREVIEW
     ========================================================= -->

<div id="preview-modal">


  <img
    id="preview-img"
    alt="Evidencia"
  >


  <div class="preview-actions">


    <button
      class="btn-side"
      style="background:#222;"
      onclick="discardPhoto()"
    >
      ❌ Descartar
    </button>


    <button
      class="btn-side"
      style="
        background:#e63946;
        border:none;
      "
      onclick="downloadPhoto()"
    >
      💾 Guardar Evidencia
    </button>


  </div>


</div>


<canvas
  id="canvas"
  style="display:none;"
></canvas>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const video =
  document.getElementById("video-stream");

const clockEl =
  document.getElementById("live-clock");

let fileName = "";


/* =========================================================
   RELOJ
   ========================================================= */

function updateClock() {

  const now = new Date();

  clockEl.innerText =
    now.toLocaleString(
      "es-MX",
      {
        day: "numeric",
        month: "numeric",
        year: "numeric",

        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",

        hour12: true
      }
    );
}


setInterval(
  updateClock,
  1000
);

updateClock();


/* =========================================================
   CÁMARA
   ========================================================= */

navigator.mediaDevices
  .getUserMedia({

    video: {

      facingMode: {
        ideal: "environment"
      },

      width: {
        ideal: 1920
      },

      height: {
        ideal: 1080
      }

    },

    audio: false

  })

  .then(
    stream => {

      video.srcObject =
        stream;

    }
  )

  .catch(
    () => {

      navigator.mediaDevices
        .getUserMedia({
          video: true
        })
        .then(
          stream => {

            video.srcObject =
              stream;

          }
        );

    }
  );


/* =========================================================
   TOMAR FOTO
   ========================================================= */

function takeSnapshot() {


  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");


  /* =======================================================
     FOTO VERTICAL
     
     IMPORTANTE:
     La imagen final tiene la misma proporción
     vertical que la pantalla del teléfono.
     ======================================================= */

  const outputW = 1080;

  const outputH = 1920;


  canvas.width =
    outputW;

  canvas.height =
    outputH;


  /* =======================================================
     VIDEO ORIGINAL
     ======================================================= */

  const videoW =
    video.videoWidth || 1920;

  const videoH =
    video.videoHeight || 1080;


  /*
   * Queremos exactamente el mismo formato
   * que vemos en el teléfono: 9:16.
   */

  const targetRatio =
    outputW / outputH;

  const videoRatio =
    videoW / videoH;


  let sx = 0;
  let sy = 0;
  let sw = videoW;
  let sh = videoH;


  /* =======================================================
     RECORTE IGUAL A object-fit: cover
     ======================================================= */

  if (videoRatio > targetRatio) {

    /*
     * El video es demasiado ancho.
     */

    sh = videoH;

    sw =
      videoH * targetRatio;

    sx =
      (videoW - sw) / 2;

    sy = 0;

  }
  else {

    /*
     * El video es demasiado alto.
     */

    sw = videoW;

    sh =
      videoW / targetRatio;

    sx = 0;

    sy =
      (videoH - sh) / 2;
  }


  /* =======================================================
     DIBUJAR FOTO
     ======================================================= */

  ctx.drawImage(

    video,

    sx,
    sy,
    sw,
    sh,

    0,
    0,
    outputW,
    outputH

  );


  /* =======================================================
     GPS
     
     AQUÍ USAMOS EXACTAMENTE LAS MISMAS
     PROPORCIONES QUE LA VISTA DE PANTALLA.
     ======================================================= */

  drawGpsOverlay(
    ctx,
    outputW,
    outputH
  );


  /* =======================================================
     NOMBRE DEL ARCHIVO
     ======================================================= */

  const now =
    new Date();


  fileName =
    "Evidencia_" +
    now
      .toISOString()
      .replace(/[:.]/g, "-") +
    ".jpg";


  /* =======================================================
     MOSTRAR PREVIEW
     ======================================================= */

  document
    .getElementById("preview-img")
    .src =
    canvas.toDataURL(
      "image/jpeg",
      0.95
    );


  document
    .getElementById("preview-modal")
    .style.display =
    "flex";
}


/* =========================================================
   DIBUJAR GPS
   ========================================================= */

function drawGpsOverlay(
  ctx,
  w,
  h
) {


  /* =======================================================
     DIMENSIONES
     ======================================================= */

  const margin =
    w * 0.03;


  const boxW =
    w * 0.94;


  const boxH =
    h * 0.20;


  const boxX =
    margin;


  const boxY =
    h -
    boxH -
    h * 0.02;


  /* =======================================================
     CAJA PRINCIPAL
     ======================================================= */

  ctx.fillStyle =
    "rgba(0,0,0,0.78)";


  ctx.fillRect(
    boxX,
    boxY,
    boxW,
    boxH
  );


  ctx.strokeStyle =
    "rgba(255,255,255,0.4)";


  ctx.lineWidth =
    2;


  ctx.strokeRect(
    boxX,
    boxY,
    boxW,
    boxH
  );


  /* =======================================================
     PADDING
     ======================================================= */

  const padding =
    boxW * 0.02;


  /* =======================================================
     COLUMNA IZQUIERDA
     ======================================================= */

  const leftX =
    boxX + padding;


  const leftW =
    boxW * 0.25;


  const gap =
    boxW * 0.025;


  /* =======================================================
     LOGO
     ======================================================= */

  const brandH =
    boxH * 0.27;


  const logoSize =
    brandH;


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    leftX,
    boxY + padding,
    logoSize,
    logoSize
  );


  /* =======================================================
     LOGO PROVISIONAL
     ======================================================= */

  ctx.fillStyle =
    "#c79b38";


  ctx.font =
    `${logoSize * 0.55}px Arial`;


  ctx.textAlign =
    "center";


  ctx.textBaseline =
    "middle";


  ctx.fillText(

    "☀",

    leftX +
      logoSize / 2,

    boxY +
      padding +
      logoSize / 2

  );


  /* =======================================================
     COYOACAN GPS
     ======================================================= */

  const brandX =
    leftX + logoSize;


  const brandW =
    leftW - logoSize;


  ctx.fillStyle =
    "#000000";


  ctx.fillRect(

    brandX,

    boxY + padding,

    brandW,

    brandH

  );


  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    `bold ${w * 0.028}px Arial`;


  ctx.textAlign =
    "left";


  ctx.textBaseline =
    "middle";


  ctx.fillText(

    "Coyoacan GPS",

    brandX + brandW * 0.05,

    boxY +
      padding +
      brandH / 2

  );


  /* =======================================================
     MAPA
     ======================================================= */

  const mapX =
    leftX;


  const mapY =
    boxY +
    padding +
    brandH +
    boxH * 0.05;


  const mapW =
    leftW;


  const mapH =
    boxY +
    boxH -
    padding -
    mapY;


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    mapX,
    mapY,
    mapW,
    mapH
  );


  /* =======================================================
     PIN
     ======================================================= */

  const pinX =
    mapX +
    mapW / 2;


  const pinY =
    mapY +
    mapH * 0.38;


  const pinRadius =
    Math.min(
      mapW,
      mapH
    ) * 0.22;


  ctx.fillStyle =
    "#e63946";


  ctx.beginPath();

  ctx.arc(

    pinX,
    pinY,

    pinRadius,

    0,
    Math.PI * 2

  );

  ctx.fill();


  /* Punta */

  ctx.beginPath();

  ctx.moveTo(

    pinX -
      pinRadius,

    pinY +
      pinRadius * 0.35

  );


  ctx.lineTo(

    pinX,

    mapY +
      mapH * 0.82

  );


  ctx.lineTo(

    pinX +
      pinRadius,

    pinY +
      pinRadius * 0.35

  );


  ctx.closePath();

  ctx.fill();


  /* Centro */

  ctx.fillStyle =
    "#ffffff";


  ctx.beginPath();

  ctx.arc(

    pinX,
    pinY,

    pinRadius * 0.45,

    0,
    Math.PI * 2

  );

  ctx.fill();


  /* =======================================================
     COLUMNA DERECHA
     ======================================================= */

  const rightX =
    leftX +
    leftW +
    gap;


  const rightW =
    boxW -
    leftW -
    gap -
    padding * 2;


  /* =======================================================
     CIUDAD
     ======================================================= */

  const cityH =
    boxH * 0.27;


  ctx.fillStyle =
    "#000000";


  ctx.fillRect(

    rightX,

    boxY + padding,

    rightW,

    cityH

  );


  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    `bold ${w * 0.038}px Arial`;


  ctx.textAlign =
    "left";


  ctx.textBaseline =
    "middle";


  ctx.fillText(

    "CDMX, Ciudad de México, México",

    rightX +
      rightW * 0.02,

    boxY +
      padding +
      cityH / 2

  );


  /* =======================================================
     INFORMACIÓN
     ======================================================= */

  const infoX =
    rightX;


  let currentY =
    boxY +
    padding +
    cityH +
    boxH * 0.08;


  /* Dirección */

  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    `${w * 0.030}px Arial`;


  ctx.textBaseline =
    "alphabetic";


  ctx.fillText(

    "Calle Centenario 123, Del Carmen, Coyoacán",

    infoX +
      rightW * 0.02,

    currentY

  );


  /* Coordenadas */

  currentY +=
    boxH * 0.17;


  ctx.fillStyle =
    "#cccccc";


  ctx.font =
    `${w * 0.027}px Arial`;


  ctx.fillText(

    "Lat 19.351234, Long -99.165678",

    infoX +
      rightW * 0.02,

    currentY

  );


  /* =======================================================
     FECHA
     ======================================================= */

  currentY +=
    boxH * 0.18;


  const now =
    new Date();


  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    `bold ${w * 0.028}px Arial`;


  ctx.fillText(

    now.toLocaleString(
      "es-MX",
      {
        day: "numeric",
        month: "numeric",
        year: "numeric",

        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",

        hour12: true
      }
    ),

    infoX +
      rightW * 0.02,

    currentY

  );

}


/* =========================================================
   DESCARTAR
   ========================================================= */

function discardPhoto() {

  document
    .getElementById(
      "preview-modal"
    )
    .style.display =
    "none";

}


/* =========================================================
   GUARDAR
   ========================================================= */

function downloadPhoto() {

  const a =
    document.createElement("a");


  a.href =
    document
      .getElementById(
        "preview-img"
      )
      .src;


  a.download =
    fileName;


  a.click();


  discardPhoto();

}

</script>

</body>

</html>

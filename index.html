<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Coyoacán GPS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body { 
      width: 100%; 
      height: 100dvh; 
      background: #000; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      overflow: hidden; 
    }
    
    .app-viewport { 
      display: flex; 
      flex-direction: column; 
      width: 100%; 
      height: 100dvh; 
    }
    
    .camera-container { 
      position: relative; 
      flex: 1; 
      width: 100%; 
      background: #000; 
      overflow: hidden; 
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    
    /* RECUADRO EXACTO AL BOCETO DE REFERENCIA */
    .gps-overlay-box {
      position: absolute; 
      bottom: 16px; 
      left: 12px; 
      right: 12px;
      background: rgba(55, 61, 67, 0.92); /* Gris del boceto */
      border: 1px solid rgba(255, 255, 255, 0.75);
      padding: 10px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    /* CUADRO MAPA CON PIN REDONDO (IZQUIERDA) */
    .map-container {
      width: 88px;
      height: 88px;
      min-width: 88px;
      background: #ffffff;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stroke;
    }

    .map-pin-icon {
      width: 34px;
      height: 48px;
    }

    /* COLUMNA DE DATOS (DERECHA) */
    .data-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: #ffffff;
      font-size: 11px;
      line-height: 1.25;
    }

    /* FILA 1: MARCA Y CIUDAD EN LA MISMA LÍNEA */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .brand-title {
      font-weight: 700;
      color: #ffffff;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand-square {
      width: 12px;
      height: 12px;
      background: #fbc02d;
      border-radius: 2px;
      display: inline-block;
    }

    .city-title {
      font-weight: 700;
      color: #ffffff;
      font-size: 12px;
      text-align: right;
    }

    /* REPTES DE DIRECCIÓN Y COORDENADAS */
    .address-line {
      color: #e0e0e0;
      font-size: 11px;
    }

    .coords-line {
      color: #cccccc;
      font-size: 11px;
      margin-top: 1px;
    }

    .datetime-line {
      font-weight: 700;
      color: #ffffff;
      font-size: 11.5px;
      margin-top: 1px;
    }

    .footer-line {
      color: #aaaaaa;
      font-size: 10px;
    }

    /* CONTROLES INFERIORES */
    .controls-panel { 
      height: 95px; 
      min-height: 95px;
      background: #0a0a0a; 
      display: flex; 
      justify-content: space-evenly; 
      align-items: center; 
      border-top: 1px solid #222;
      z-index: 20;
    }
    
    .btn-side { 
      background: #1a1a1a; 
      color: #fff; 
      border: 1px solid #333; 
      padding: 9px 15px; 
      border-radius: 8px; 
      font-size: 0.8rem; 
      font-weight: 600; 
    }
    
    .btn-capture { 
      width: 66px; 
      height: 66px; 
      border-radius: 50%; 
      background: #ffffff; 
      border: 4px solid #e63946; 
      cursor: pointer; 
    }

    #preview-modal { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: #000; 
      z-index: 100; 
      flex-direction: column; 
    }
    
    #preview-img { 
      width: 100%; 
      flex: 1; 
      object-fit: contain; 
      background: #000; 
    }
    
    .preview-actions { 
      height: 85px; 
      background: #0a0a0a; 
      display: flex; 
      justify-content: space-evenly; 
      align-items: center; 
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="camera-container">
      <video id="video-stream" autoplay playsinline muted></video>
      
      <!-- ESTRUCTURA IDÉNTICA A TU IMAGEN -->
      <div class="gps-overlay-box">
        <!-- Izquierda: Cuadro Blanco con Pin -->
        <div class="map-container">
          <svg class="map-pin-icon" viewBox="0 0 100 140" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 0C22.4 0 0 22.4 0 50C0 87.5 50 140 50 140C50 140 100 87.5 100 50C100 22.4 77.6 0 50 0Z" fill="#EA4335"/>
            <ellipse cx="50" cy="45" rx="20" ry="20" fill="#B31412"/>
            <path d="M50 140 L45 95 L55 95 Z" fill="#4285F4" opacity="0.4"/>
            <rect x="47" y="90" width="6" height="40" fill="#78909C" />
          </svg>
        </div>

        <!-- Derecha: Datos alineados -->
        <div class="data-container">
          <div class="header-row">
            <span class="brand-title"><span class="brand-square"></span> Coyoacan GPS</span>
            <span class="city-title">CMDX, Ciudad de Mexico, Mexico</span>
          </div>
          <div class="address-line">Calle Centenario 123, Del Carmen,</div>
          <div class="address-line">Coyoacan</div>
          <div class="coords-line">Lat 19.351234, Long -99.165678</div>
          <div class="datetime-line" id="live-clock">14/09/2026 08:40 a.m.</div>
          <div class="footer-line">Foto tomada por Coyoacan GPS</div>
        </div>
      </div>
    </div>

    <div class="controls-panel">
      <button class="btn-side" onclick="alert('Opción de video')">📹 Video</button>
      <button class="btn-capture" onclick="takeSnapshot()"></button>
      <button class="btn-side" onclick="alert('Galería')">🖼️ Galería</button>
    </div>
  </div>

  <div id="preview-modal">
    <img id="preview-img" alt="Evidencia">
    <div class="preview-actions">
      <button class="btn-side" style="background: #222;" onclick="discardPhoto()">❌ Descartar</button>
      <button class="btn-side" style="background: #e63946; border: none;" onclick="downloadPhoto()">💾 Guardar Evidencia</button>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video-stream');
    const clockEl = document.getElementById('live-clock');
    let fileName = '';

    function updateClock() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: true });
      clockEl.innerText = `${dateStr} ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
    }).catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true }).then(stream => video.srcObject = stream);
    });

    function takeSnapshot() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      const w = video.videoWidth || 1280;
      const h = video.videoHeight || 720;
      canvas.width = w;
      canvas.height = h;

      // 1. Imagen de fondo
      ctx.drawImage(video, 0, 0, w, h);

      // 2. Proporciones exactas de la caja
      const margin = w * 0.035;
      const cardW = w - (margin * 2);
      const cardH = h * 0.20;
      const cardY = h - cardH - margin;

      // Fondo Gris
      ctx.fillStyle = "rgba(55, 61, 67, 0.94)";
      ctx.fillRect(margin, cardY, cardW, cardH);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
      ctx.lineWidth = 2;
      ctx.strokeRect(margin, cardY, cardW, cardH);

      // 3. Cuadro blanco mapa
      const mapW = cardH * 0.76;
      const mapX = margin + 12;
      const mapY = cardY + (cardH - mapW) / 2;

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(mapX, mapY, mapW, mapW);

      // Dibujar Pin Rojo exacto en Canvas
      const centerX = mapX + (mapW / 2);
      const centerY = mapY + (mapW * 0.38);
      const radius = mapW * 0.22;

      ctx.fillStyle = "#EA4335";
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(centerX - radius, centerY + 3);
      ctx.lineTo(centerX, mapY + (mapW * 0.75));
      ctx.lineTo(centerX + radius, centerY + 3);
      ctx.fill();

      // Palo del pin
      ctx.fillStyle = "#78909C";
      ctx.fillRect(centerX - 2, mapY + (mapW * 0.70), 4, mapW * 0.22);

      // 4. Textos alineados
      const textX = mapX + mapW + 14;
      const fontSize = w * 0.021;
      let lineY = mapY + (mapW * 0.16);

      // Fila 1: Marca y Ciudad
      ctx.fillStyle = "#fbc02d";
      ctx.fillRect(textX, lineY - 10, 10, 10);
      
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${fontSize * 1.05}px sans-serif`;
      ctx.fillText("Coyoacan GPS", textX + 14, lineY);

      ctx.textAlign = "right";
      ctx.fillText("CMDX, Ciudad de Mexico, Mexico", margin + cardW - 12, lineY);
      ctx.textAlign = "left";

      // Dirección
      lineY += (mapW * 0.20);
      ctx.font = `${fontSize}px sans-serif`;
      ctx.fillStyle = "#e0e0e0";
      ctx.fillText("Calle Centenario 123, Del Carmen,", textX, lineY);
      
      lineY += (mapW * 0.18);
      ctx.fillText("Coyoacan", textX, lineY);

      // Coordenadas
      lineY += (mapW * 0.18);
      ctx.fillStyle = "#cccccc";
      ctx.fillText("Lat 19.351234, Long -99.165678", textX, lineY);

      // Fecha y Hora
      lineY += (mapW * 0.20);
      const now = new Date();
      fileName = `Evidencia_${now.toISOString().replace(/[:.]/g, '-')}.jpg`;
      const dateStr = now.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: true });
      
      ctx.font = `bold ${fontSize * 1.05}px sans-serif`;
      ctx.fillStyle = "#ffffff";
      ctx.fillText(`${dateStr} ${timeStr}`, textX, lineY);

      // Pie
      lineY += (mapW * 0.16);
      ctx.font = `${fontSize * 0.9}px sans-serif`;
      ctx.fillStyle = "#aaaaaa";
      ctx.fillText("Foto tomada por Coyoacan GPS", textX, lineY);

      // Mostrar modal de vista previa
      document.getElementById('preview-img').src = canvas.toDataURL('image/jpeg', 0.95);
      document.getElementById('preview-modal').style.display = 'flex';
    }

    function discardPhoto() {
      document.getElementById('preview-modal').style.display = 'none';
    }

    function downloadPhoto() {
      const a = document.createElement('a');
      a.href = document.getElementById('preview-img').src;
      a.download = fileName;
      a.click();
      discardPhoto();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Coyoacán GPS</title>


  <!-- =====================================================
       HTML2CANVAS
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>


  <!-- =====================================================
       LEAFLET
       ===================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    /* =====================================================
       RESET
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      -webkit-tap-highlight-color: transparent;
    }


    /* =====================================================
       HTML / BODY
       ===================================================== */

    html,
    body {

      width: 100%;
      height: 100%;

      background: #000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      overflow: hidden;
    }


    /* =====================================================
       APP
       ===================================================== */

    .app-viewport {

      width: 100%;
      height: 100dvh;

      display: flex;
      flex-direction: column;

      background: #000;
    }


    /* =====================================================
       CONTENEDOR DE CÁMARA
       ===================================================== */

    .camera-container {

      position: relative;

      width: 100%;

      flex: 1;
      min-height: 0;

      background: #000;

      overflow: hidden;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    /* =====================================================
       VIDEO
       ===================================================== */

    #video-stream {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      z-index: 1;
    }


    /* =====================================================
       TARJETA GPS
       ===================================================== */

    .gps-box {

      position: absolute;

      left: 12px;
      right: 12px;
      bottom: 16px;

      background: rgba(0, 0, 0, 0.78);

      border: 1px solid rgba(255, 255, 255, 0.40);

      border-radius: 8px;

      padding: 8px;

      display: flex;

      gap: 10px;

      align-items: flex-start;

      z-index: 10;

      backdrop-filter: blur(6px);

      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.60);
    }


    /* =====================================================
       MAPA
       ===================================================== */

    .map-square {

      width: clamp(105px, 32vw, 135px);

      height: clamp(105px, 32vw, 115px);

      min-width: clamp(105px, 32vw, 135px);

      background: #ffffff;

      border-radius: 4px;

      display: flex;

      flex-direction: column;

      align-items: stretch;

      justify-content: flex-start;

      overflow: hidden;

      flex-shrink: 0;
    }


    /* =====================================================
       CABECERA DEL MAPA
       ===================================================== */

    .map-header {

      width: 100%;

      height: 32px;

      display: flex;

      align-items: center;

      justify-content: flex-start;

      padding-left: 5px;
      padding-right: 5px;

      box-sizing: border-box;

      background: #ffffff;

      overflow: hidden;

      white-space: nowrap;
    }


    /* =====================================================
       LOGO
       ===================================================== */

    .map-logo {

      width: 27px;
      height: 27px;

      flex-shrink: 0;

      object-fit: contain;

      display: block;
    }


    /* =====================================================
       TÍTULO DEL MAPA
       ===================================================== */

    .map-title {

      margin-left: 5px;

      color: #000000;

      font-size: clamp(9px, 2.8vw, 11px);

      font-weight: 800;

      line-height: 1;

      white-space: nowrap;

      flex-shrink: 0;
    }


    /* =====================================================
       ÁREA DEL MAPA
       ===================================================== */

    .map-white-area {

      width: calc(100% - 8px);

      height: calc(100% - 36px);

      margin-left: 4px;

      background: #ffffff;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 3px;

      overflow: hidden;

      flex: 1;

      min-height: 0;

      position: relative;
    }


    /* =====================================================
       MAPA LEAFLET
       ===================================================== */

    #gps-map {

      width: 100%;
      height: 100%;

      min-width: 0;
      min-height: 0;
    }


    /* =====================================================
       COLUMNA DE INFORMACIÓN
       ===================================================== */

    .info-column {

      flex: 1;

      min-width: 0;

      display: flex;

      flex-direction: column;

      gap: 3px;

      color: #ffffff;

      overflow: hidden;
    }


    /* =====================================================
       PRIMERA LÍNEA
       CIUDAD / ESTADO / PAÍS
       ===================================================== */

    .city-title-large {

      font-size: 15px;

      font-weight: 800;

      color: #ffffff;

      line-height: 1.15;

      white-space: normal;

      overflow-wrap: break-word;

      word-break: normal;
    }


    /* =====================================================
       DIRECCIÓN
       ===================================================== */

    .address-text {

      font-size: 12px;

      font-weight: 500;

      color: #e0e0e0;

      line-height: 1.2;

      white-space: normal;

      overflow-wrap: break-word;

      word-break: normal;
    }


    /* =====================================================
       COORDENADAS
       ===================================================== */

    .coords-text {

      font-size: 12px;

      font-weight: 500;

      color: #e0e0e0;

      line-height: 1.2;

      white-space: normal;

      overflow-wrap: break-word;
    }


    /* =====================================================
       FECHA Y HORA
       ===================================================== */

    .datetime-text {

      font-size: 12px;

      font-weight: 500;

      color: #e0e0e0;

      margin-top: 1px;

      line-height: 1.2;

      white-space: normal;

      overflow-wrap: break-word;
    }


    /* =====================================================
       CRÉDITO
       ===================================================== */

    .photo-credit {

      font-size: 12px;

      font-weight: 500;

      color: #e0e0e0;

      line-height: 1.2;

      white-space: normal;

      overflow-wrap: break-word;
    }


    /* =====================================================
       CONTROLES
       ===================================================== */

    .controls-panel {

      width: 100%;

      height: 95px;

      min-height: 95px;

      background: #0a0a0a;

      display: flex;

      justify-content: space-evenly;

      align-items: center;

      border-top: 1px solid #222;

      z-index: 20;
    }


    /* =====================================================
       BOTONES LATERALES
       ===================================================== */

    .btn-side {

      background: #1a1a1a;

      color: #fff;

      border: 1px solid #333;

      padding: 9px 15px;

      border-radius: 8px;

      font-size: 0.8rem;

      font-weight: 600;

      cursor: pointer;
    }


    /* =====================================================
       BOTÓN DE CAPTURA
       ===================================================== */

    .btn-capture {

      width: 66px;
      height: 66px;

      border-radius: 50%;

      background: #ffffff;

      border: 4px solid #e63946;

      cursor: pointer;
    }


    /* =====================================================
       MODAL DE PREVISUALIZACIÓN
       ===================================================== */

    #preview-modal {

      display: none;

      position: fixed;

      inset: 0;

      background: #000;

      z-index: 100;

      flex-direction: column;
    }


    /* =====================================================
       FOTO DE PREVISUALIZACIÓN
       ===================================================== */

    #preview-img {

      width: 100%;

      height: auto;

      flex: 1;

      min-height: 0;

      object-fit: contain;

      background: #000;

      display: block;
    }


    /* =====================================================
       BOTONES DEL PREVIEW
       ===================================================== */

    .preview-actions {

      width: 100%;

      height: 85px;

      min-height: 85px;

      background: #0a0a0a;

      display: flex;

      justify-content: space-evenly;

      align-items: center;
    }


    /* =====================================================
       TELÉFONOS PEQUEÑOS
       ===================================================== */

    @media (max-width: 380px) {

      .gps-box {

        left: 8px;
        right: 8px;

        bottom: 12px;

        padding: 6px;

        gap: 8px;
      }


      .city-title-large {

        font-size: 13px;
      }


      .address-text {

        font-size: 10px;
      }


      .coords-text {

        font-size: 9px;
      }


      .datetime-text {

        font-size: 10px;
      }


      .photo-credit {

        font-size: 10px;
      }

    }


    /* =====================================================
       TABLETS / PANTALLAS GRANDES
       ===================================================== */

    @media (min-width: 600px) {

      .gps-box {

        left: 20px;
        right: 20px;

        bottom: 20px;

        padding: 12px 14px;

        gap: 12px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       APLICACIÓN
       ===================================================== -->

  <div class="app-viewport">


    <!-- ===================================================
         CÁMARA
         =================================================== -->

    <div
      class="camera-container"
      id="camera-container"
    >


      <!-- ===============================================
           VIDEO
           =============================================== -->

      <video
        id="video-stream"
        autoplay
        playsinline
        muted
      ></video>


      <!-- ===============================================
           TARJETA GPS
           =============================================== -->

      <div class="gps-box">


        <!-- =============================================
             MAPA
             ============================================= -->

        <div class="map-square">


          <!-- ===========================================
               CABECERA
               =========================================== -->

          <div class="map-header">

            <img
              class="map-logo"
              src="Logo.jpeg"
              alt="Coyoacan GPS"
            >

            <span class="map-title">
              Coyoacan GPS
            </span>

          </div>


          <!-- ===========================================
               MAPA LEAFLET
               =========================================== -->

          <div class="map-white-area">

            <div id="gps-map"></div>

          </div>


        </div>


        <!-- =============================================
             INFORMACIÓN
             ============================================= -->

        <div class="info-column">


          <!-- ===========================================
               CIUDAD / ESTADO / PAÍS
               =========================================== -->

          <div
            class="city-title-large"
            id="location-title"
          >

            Obteniendo ubicación...

          </div>


          <!-- ===========================================
               DIRECCIÓN
               =========================================== -->

          <div
            class="address-text"
            id="location-address"
          >

            Obteniendo dirección...

          </div>


          <!-- ===========================================
               COORDENADAS
               =========================================== -->

          <div
            class="coords-text"
            id="location-coordinates"
          >

            Lat --, Long --

          </div>


          <!-- ===========================================
               FECHA
               =========================================== -->

          <div
            class="datetime-text"
            id="live-clock"
          >

            Obteniendo fecha y hora...

          </div>


          <!-- ===========================================
               CRÉDITO FIJO
               =========================================== -->

          <div class="photo-credit">

            Foto tomada por Coyoacan GPS

          </div>


        </div>


      </div>


    </div>


    <!-- ===================================================
         CONTROLES
         =================================================== -->

    <div class="controls-panel">


      <button
        class="btn-side"
        onclick="alert('Modo video')"
      >

        📹 Video

      </button>


      <!-- ===============================================
           CAPTURAR
           =============================================== -->

      <button
        class="btn-capture"
        onclick="takeSnapshot()"
        aria-label="Tomar fotografía"
      >
      </button>


      <button
        class="btn-side"
        onclick="alert('Galería')"
      >

        🖼️ Galería

      </button>


    </div>


  </div>


  <!-- =====================================================
       PREVIEW
       ===================================================== -->

  <div
    id="preview-modal"
  >


    <img
      id="preview-img"
      alt="Evidencia"
    >


    <div class="preview-actions">


      <button
        class="btn-side"
        style="background:#222;"
        onclick="discardPhoto()"
      >

        ❌ Descartar

      </button>


      <button
        class="btn-side"
        style="
          background:#e63946;
          border:none;
        "
        onclick="downloadPhoto()"
      >

        💾 Guardar Evidencia

      </button>


    </div>


  </div>


  <!-- =====================================================
       CANVAS OCULTO
       ===================================================== -->

  <canvas
    id="video-canvas"
    style="display:none;"
  ></canvas>


  <!-- =====================================================
       LEAFLET JS
       ===================================================== -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <script>

    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const video =
      document.getElementById(
        'video-stream'
      );


    const clockEl =
      document.getElementById(
        'live-clock'
      );


    const cameraContainer =
      document.getElementById(
        'camera-container'
      );


    const previewModal =
      document.getElementById(
        'preview-modal'
      );


    const previewImg =
      document.getElementById(
        'preview-img'
      );


    const videoCanvas =
      document.getElementById(
        'video-canvas'
      );


    const locationTitle =
      document.getElementById(
        'location-title'
      );


    const locationAddress =
      document.getElementById(
        'location-address'
      );


    const locationCoordinates =
      document.getElementById(
        'location-coordinates'
      );


    /* =====================================================
       VARIABLES DEL MAPA
       ===================================================== */

    let gpsMap = null;

    let gpsMarker = null;


    /* =====================================================
       NOMBRE DEL ARCHIVO
       ===================================================== */

    let fileName = '';


    /* =====================================================
       RELOJ
       ===================================================== */

    function updateClock() {

      const now =
        new Date();


      const date =
        now.toLocaleDateString(
          'es-MX',
          {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
          }
        );


      const time =
        now.toLocaleTimeString(
          'es-MX',
          {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
          }
        );


      clockEl.innerText =
        `${date}, ${time}`;

    }


    setInterval(
      updateClock,
      1000
    );


    updateClock();


    /* =====================================================
       INICIALIZAR / ACTUALIZAR MAPA
       ===================================================== */

    function actualizarMapa(
      latitud,
      longitud
    ) {

      try {

        /* ==============================================
           CREAR MAPA POR PRIMERA VEZ
           ============================================== */

        if (!gpsMap) {

          gpsMap =
            L.map(
              'gps-map',
              {

                zoomControl: false,

                attributionControl: true

              }
            ).setView(

              [
                latitud,
                longitud
              ],

              17

            );


          /* ============================================
             CAPA OPENSTREETMAP
             ============================================ */

          L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {

              maxZoom: 19,

              attribution:
                '&copy; OpenStreetMap'

            }
          ).addTo(
            gpsMap
          );


          /* ============================================
             MARCADOR
             ============================================ */

          gpsMarker =
            L.marker(
              [
                latitud,
                longitud
              ]
            ).addTo(
              gpsMap
            );


        }
        else {

          /* ============================================
             ACTUALIZAR POSICIÓN DEL MAPA
             ============================================ */

          gpsMap.setView(

            [
              latitud,
              longitud
            ],

            17

          );


          /* ============================================
             ACTUALIZAR MARCADOR
             ============================================ */

          if (gpsMarker) {

            gpsMarker.setLatLng(

              [
                latitud,
                longitud
              ]

            );

          }

        }


        /* ==============================================
           ASEGURAR QUE LEAFLET RECALCULE EL TAMAÑO
           ============================================== */

        setTimeout(
          function() {

            if (gpsMap) {

              gpsMap.invalidateSize();

            }

          },
          150
        );


        console.log(
          'Mapa actualizado:',
          latitud,
          longitud
        );


      } catch (error) {

        console.error(
          'Error al actualizar el mapa:',
          error
        );

      }

    }


    /* =====================================================
       INICIAR CÁMARA
       ===================================================== */

    async function startCamera() {

      try {

        const stream =
          await navigator
            .mediaDevices
            .getUserMedia({

              video: {

                facingMode: {
                  ideal: 'environment'
                },

                width: {
                  ideal: 1920
                },

                height: {
                  ideal: 1080
                }

              },

              audio: false

            });


        video.srcObject =
          stream;


      } catch (error) {

        console.error(
          'Error al acceder a la cámara:',
          error
        );


        try {

          const stream =
            await navigator
              .mediaDevices
              .getUserMedia({

                video: true,

                audio: false

              });


          video.srcObject =
            stream;


        } catch (fallbackError) {

          console.error(
            'No fue posible abrir la cámara:',
            fallbackError
          );


          alert(
            'No fue posible acceder a la cámara.'
          );

        }

      }

    }


    startCamera();


    /* =====================================================
       GPS REAL
       ===================================================== */

    function obtenerUbicacionGPS() {

      if (!navigator.geolocation) {

        console.error(
          'Este dispositivo no soporta geolocalización.'
        );


        locationTitle.innerText =
          'Ubicación no disponible';


        locationAddress.innerText =
          'Este dispositivo no soporta GPS';


        locationCoordinates.innerText =
          'Lat --, Long --';


        return;

      }


      navigator.geolocation.getCurrentPosition(

        async function(position) {

          const latitud =
            position.coords.latitude;

          const longitud =
            position.coords.longitude;

          const precision =
            position.coords.accuracy;


          /* ==============================================
             MOSTRAR COORDENADAS REALES
             ============================================== */

          locationCoordinates.innerText =
            `Lat ${latitud.toFixed(6)}, Long ${longitud.toFixed(6)}`;


          console.log(
            'GPS - Latitud:',
            latitud
          );


          console.log(
            'GPS - Longitud:',
            longitud
          );


          console.log(
            'GPS - Precisión:',
            precision,
            'metros'
          );


          /* ==============================================
             ACTUALIZAR MAPA
             ============================================== */

          actualizarMapa(
            latitud,
            longitud
          );


          /* ==============================================
             OBTENER DIRECCIÓN
             ============================================== */

          await obtenerDireccion(
            latitud,
            longitud
          );

        },


        function(error) {

          console.error(
            'No se pudo obtener la ubicación GPS:',
            error
          );


          locationTitle.innerText =
            'Ubicación no disponible';


          locationAddress.innerText =
            'No fue posible obtener la dirección';


          locationCoordinates.innerText =
            'Lat --, Long --';

        },


        {

          enableHighAccuracy: true,

          timeout: 15000,

          maximumAge: 0

        }

      );

    }


    /* =====================================================
       OBTENER DIRECCIÓN A PARTIR DEL GPS
       ===================================================== */

    async function obtenerDireccion(
      latitud,
      longitud
    ) {

      try {

        /*
         * Servicio de geocodificación inversa
         *
         * Convierte:
         *
         * Latitud + Longitud
         *
         * en:
         *
         * Calle + ciudad + estado + país
         */

        const url =
          `https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&lat=${encodeURIComponent(latitud)}&lon=${encodeURIComponent(longitud)}`;


        const response =
          await fetch(
            url,
            {
              method: 'GET'
            }
          );


        if (!response.ok) {

          throw new Error(
            `Error HTTP ${response.status}`
          );

        }


        const data =
          await response.json();


        console.log(
          'Respuesta de dirección:',
          data
        );


        if (
          !data ||
          !data.address
        ) {

          throw new Error(
            'No se encontró información de dirección.'
          );

        }


        const address =
          data.address;


        /* ==============================================
           PAÍS
           ============================================== */

        const pais =
          address.country ||
          '';


        /* ==============================================
           ESTADO
           ============================================== */

        const estado =
          address.state ||
          '';


        /* ==============================================
           CIUDAD / MUNICIPIO
           ============================================== */

        const ciudad =
          address.city ||
          address.town ||
          address.village ||
          address.municipality ||
          address.county ||
          '';


        /* ==============================================
           CONSTRUIR PRIMERA LÍNEA
           ============================================== */

        const partesUbicacion = [];


        if (ciudad) {

          partesUbicacion.push(
            ciudad
          );

        }


        if (
          estado &&
          estado !== ciudad
        ) {

          partesUbicacion.push(
            estado
          );

        }


        if (
          pais &&
          pais !== estado
        ) {

          partesUbicacion.push(
            pais
          );

        }


        const tituloUbicacion =
          partesUbicacion.join(
            ', '
          );


        locationTitle.innerText =
          tituloUbicacion ||
          'Ubicación desconocida';


        /* ==============================================
           CALLE
           ============================================== */

        const calle =
          address.road ||
          address.pedestrian ||
          address.footway ||
          address.path ||
          '';


        /* ==============================================
           NÚMERO
           ============================================== */

        const numero =
          address.house_number ||
          '';


        let direccionFinal =
          '';


        if (
          calle &&
          numero
        ) {

          direccionFinal =
            `${calle} ${numero}`;

        }
        else if (calle) {

          direccionFinal =
            calle;

        }
        else if (
          address.suburb
        ) {

          direccionFinal =
            address.suburb;

        }
        else if (
          address.neighbourhood
        ) {

          direccionFinal =
            address.neighbourhood;

        }
        else {

          direccionFinal =
            'Dirección no disponible';

        }


        locationAddress.innerText =
          direccionFinal;


        console.log(
          'Ubicación:',
          tituloUbicacion
        );


        console.log(
          'Dirección:',
          direccionFinal
        );


      } catch (error) {

        console.error(
          'No fue posible obtener la dirección:',
          error
        );


        /*
         * Si falla la dirección,
         * conservamos las coordenadas reales.
         */

        locationTitle.innerText =
          'Ubicación GPS';


        locationAddress.innerText =
          'Dirección no disponible';

      }

    }


    /* =====================================================
       INICIAR GPS
       ===================================================== */

    obtenerUbicacionGPS();


    /* =====================================================
       ESPERAR A QUE LA CÁMARA ESTÉ LISTA
       ===================================================== */

    function waitForVideo() {

      return new Promise(
        resolve => {

          if (
            video.readyState >= 2 &&
            video.videoWidth > 0 &&
            video.videoHeight > 0
          ) {

            resolve();

            return;

          }


          const check =
            setInterval(
              () => {

                if (
                  video.readyState >= 2 &&
                  video.videoWidth > 0 &&
                  video.videoHeight > 0
                ) {

                  clearInterval(
                    check
                  );

                  resolve();

                }

              },
              50
            );

        }
      );

    }


    /* =====================================================
       CAPTURAR EL FRAME DEL VIDEO
       ===================================================== */

    function captureVideoFrame() {

      const rect =
        cameraContainer
          .getBoundingClientRect();


      const width =
        Math.round(
          rect.width
        );


      const height =
        Math.round(
          rect.height
        );


      const scale =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );


      videoCanvas.width =
        Math.round(
          width * scale
        );


      videoCanvas.height =
        Math.round(
          height * scale
        );


      const ctx =
        videoCanvas.getContext(
          '2d'
        );


      const videoWidth =
        video.videoWidth;


      const videoHeight =
        video.videoHeight;


      /* ================================================
         MISMO RECORTE QUE OBJECT-FIT: COVER
         ================================================ */

      const containerRatio =
        width / height;


      const videoRatio =
        videoWidth / videoHeight;


      let sourceX = 0;

      let sourceY = 0;

      let sourceWidth =
        videoWidth;

      let sourceHeight =
        videoHeight;


      if (
        videoRatio >
        containerRatio
      ) {

        sourceWidth =
          videoHeight *
          containerRatio;


        sourceX =
          (
            videoWidth -
            sourceWidth
          ) / 2;

      }
      else {

        sourceHeight =
          videoWidth /
          containerRatio;


        sourceY =
          (
            videoHeight -
            sourceHeight
          ) / 2;

      }


      /* ================================================
         DIBUJAR VIDEO
         ================================================ */

      ctx.drawImage(

        video,

        sourceX,
        sourceY,

        sourceWidth,
        sourceHeight,

        0,
        0,

        videoCanvas.width,
        videoCanvas.height

      );


      return {

        width,

        height,

        scale

      };

    }


    /* =====================================================
       TOMAR FOTO
       ===================================================== */

    async function takeSnapshot() {

      try {

        await waitForVideo();


        const dimensions =
          captureVideoFrame();


        /* ==============================================
           OCULTAR VIDEO
           ============================================== */

        const originalVideoVisibility =
          video.style.visibility;


        video.style.visibility =
          'hidden';


        /* ==============================================
           CANVAS DEL FRAME
           ============================================== */

        const backgroundCanvas =
          document.createElement(
            'canvas'
          );


        backgroundCanvas.width =
          videoCanvas.width;


        backgroundCanvas.height =
          videoCanvas.height;


        const bgCtx =
          backgroundCanvas.getContext(
            '2d'
          );


        bgCtx.drawImage(
          videoCanvas,
          0,
          0
        );


        backgroundCanvas.style.position =
          'absolute';


        backgroundCanvas.style.left =
          '0';


        backgroundCanvas.style.top =
          '0';


        backgroundCanvas.style.width =
          '100%';


        backgroundCanvas.style.height =
          '100%';


        backgroundCanvas.style.zIndex =
          '0';


        backgroundCanvas.style.pointerEvents =
          'none';


        cameraContainer.insertBefore(

          backgroundCanvas,

          cameraContainer.firstChild

        );


        /* ==============================================
           ESPERAR UN FRAME
           ============================================== */

        await new Promise(
          resolve =>
            requestAnimationFrame(
              () => resolve()
            )
        );


        /* ==============================================
           CAPTURAR CONTENEDOR COMPLETO
           ============================================== */

        const finalCanvas =
          await html2canvas(
            cameraContainer,
            {

              width:
                dimensions.width,

              height:
                dimensions.height,

              scale:
                dimensions.scale,

              backgroundColor:
                '#000000',

              useCORS:
                true,

              allowTaint:
                true,

              logging:
                false,

              ignoreElements:
                function(element) {

                  return (
                    element === video
                  );

                }

            }
          );


        /* ==============================================
           CONVERTIR A JPEG
           ============================================== */

        const imageData =
          finalCanvas.toDataURL(
            'image/jpeg',
            0.95
          );


        /* ==============================================
           NOMBRE DEL ARCHIVO
           ============================================== */

        const now =
          new Date();


        fileName =
          `Evidencia_${
            now
              .toISOString()
              .replace(
                /[:.]/g,
                '-'
              )
          }.jpg`;


        /* ==============================================
           MOSTRAR FOTO
           ============================================== */

        previewImg.src =
          imageData;


        previewModal.style.display =
          'flex';


        /* ==============================================
           RESTAURAR VIDEO
           ============================================== */

        video.style.visibility =
          originalVideoVisibility;


        backgroundCanvas.remove();


      } catch (error) {

        console.error(
          'Error al tomar la fotografía:',
          error
        );


        alert(
          'No fue posible tomar la fotografía.'
        );


        video.style.visibility =
          'visible';

      }

    }


    /* =====================================================
       DESCARTAR FOTO
       ===================================================== */

    function discardPhoto() {

      previewModal.style.display =
        'none';


      previewImg.src =
        '';

    }


    /* =====================================================
       GUARDAR FOTO
       ===================================================== */

    function downloadPhoto() {

      if (
        !previewImg.src
      ) {

        return;

      }


      const link =
        document.createElement(
          'a'
        );


      link.href =
        previewImg.src;


      link.download =
        fileName ||
        'Evidencia.jpg';


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      discardPhoto();

    }


  </script>

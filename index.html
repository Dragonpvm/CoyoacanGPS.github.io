<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>Coyoacán GPS</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      overflow: hidden;
    }

    /* =========================================================
       APLICACIÓN
       ========================================================= */

    .app-viewport {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
    }

    /* =========================================================
       CÁMARA
       ========================================================= */

    .camera-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =========================================================
       RECUADRO GPS SOBRE LA CÁMARA
       ========================================================= */

    .gps-overlay-box {
      position: absolute;

      bottom: 20px;
      left: 3.5%;
      right: 3.5%;

      background: rgba(55, 61, 67, 0.92);

      border: 1px solid rgba(255, 255, 255, 0.75);

      padding: 10px;

      display: flex;
      gap: 12px;

      align-items: flex-start;

      z-index: 10;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.6);
    }

    /* =========================================================
       CUADRO BLANCO DEL PIN
       ========================================================= */

    .map-container {
      width: 105px;
      height: 105px;

      min-width: 105px;

      background: #ffffff;

      border-radius: 1px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .map-pin-icon {
      width: 60px;
      height: 82px;
    }

    /* =========================================================
       INFORMACIÓN
       ========================================================= */

    .data-container {
      flex: 1;

      display: flex;
      flex-direction: column;

      gap: 2px;

      color: #ffffff;

      font-size: 14px;

      line-height: 1.25;

      min-width: 0;
    }

    /* =========================================================
       ENCABEZADO
       ========================================================= */

    .header-row {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 2px;

      gap: 10px;
    }

    .brand-title {
      font-weight: 700;

      color: #ffffff;

      font-size: 14px;

      display: flex;

      align-items: center;

      gap: 4px;

      white-space: nowrap;
    }

    .brand-square {
      width: 13px;
      height: 13px;

      background: #fbc02d;

      border-radius: 2px;

      display: inline-block;

      flex-shrink: 0;
    }

    .city-title {
      font-weight: 700;

      color: #ffffff;

      font-size: 14px;

      text-align: right;

      white-space: nowrap;
    }

    /* =========================================================
       DATOS
       ========================================================= */

    .address-line {
      color: #e0e0e0;

      font-size: 14px;
    }

    .coords-line {
      color: #cccccc;

      font-size: 14px;

      margin-top: 1px;
    }

    .datetime-line {
      font-weight: 700;

      color: #ffffff;

      font-size: 14px;

      margin-top: 1px;
    }

    .footer-line {
      color: #aaaaaa;

      font-size: 13px;
    }

    /* =========================================================
       CONTROLES
       ========================================================= */

    .controls-panel {
      height: 95px;

      min-height: 95px;

      background: #0a0a0a;

      display: flex;

      justify-content: space-evenly;

      align-items: center;

      border-top: 1px solid #222;

      z-index: 20;
    }

    .btn-side {
      background: #1a1a1a;

      color: #fff;

      border: 1px solid #333;

      padding: 9px 15px;

      border-radius: 8px;

      font-size: 0.8rem;

      font-weight: 600;
    }

    .btn-capture {
      width: 66px;

      height: 66px;

      border-radius: 50%;

      background: #ffffff;

      border: 4px solid #e63946;

      cursor: pointer;
    }

    /* =========================================================
       VISTA PREVIA
       ========================================================= */

    #preview-modal {
      display: none;

      position: fixed;

      inset: 0;

      background: #000;

      z-index: 100;

      flex-direction: column;

      align-items: center;

      justify-content: center;
    }

    #preview-img {
      width: 100%;

      height: calc(100% - 85px);

      object-fit: contain;

      background: #000;
    }

    .preview-actions {
      width: 100%;

      height: 85px;

      background: #0a0a0a;

      display: flex;

      justify-content: space-evenly;

      align-items: center;
    }

  </style>
</head>


<body>

  <div class="app-viewport">

    <!-- =====================================================
         CÁMARA
         ===================================================== -->

    <div class="camera-container">

      <video
        id="video-stream"
        autoplay
        playsinline
        muted>
      </video>


      <!-- ===================================================
           RECUADRO GPS
           =================================================== -->

      <div class="gps-overlay-box">

        <!-- PIN -->
        <div class="map-container">

          <svg
            class="map-pin-icon"
            viewBox="0 0 100 140"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >

            <!-- Cabeza del pin -->
            <path
              d="
                M50 0
                C22.4 0 0 22.4 0 50
                C0 87.5 50 140 50 140
                C50 140 100 87.5 100 50
                C100 22.4 77.6 0 50 0Z
              "
              fill="#EA4335"
            />

            <!-- Centro -->
            <ellipse
              cx="50"
              cy="45"
              rx="20"
              ry="20"
              fill="#ffffff"
            />

          </svg>

        </div>


        <!-- =================================================
             DATOS
             ================================================= -->

        <div class="data-container">

          <div class="header-row">

            <span class="brand-title">

              <span class="brand-square"></span>

              Coyoacan GPS

            </span>


            <span class="city-title">

              CMDX, Ciudad de Mexico, Mexico

            </span>

          </div>


          <div class="address-line">

            Calle Centenario 123, Del Carmen,

          </div>


          <div class="address-line">

            Coyoacan

          </div>


          <div class="coords-line">

            Lat 19.351234, Long -99.165678

          </div>


          <div
            class="datetime-line"
            id="live-clock"
          >

            14/09/2026 08:20 a.m.

          </div>


          <div class="footer-line">

            Foto tomada por Coyoacan GPS

          </div>

        </div>

      </div>

    </div>


    <!-- =====================================================
         BOTONES
         ===================================================== -->

    <div class="controls-panel">

      <button
        class="btn-side"
        onclick="alert('Opción de video')"
      >
        📹 Video
      </button>


      <button
        class="btn-capture"
        onclick="takeSnapshot()"
      >
      </button>


      <button
        class="btn-side"
        onclick="alert('Galería')"
      >
        🖼️ Galería
      </button>

    </div>

  </div>


  <!-- =======================================================
       MODAL DE PREVISUALIZACIÓN
       ======================================================= -->

  <div id="preview-modal">

    <img
      id="preview-img"
      alt="Evidencia"
    >


    <div class="preview-actions">

      <button
        class="btn-side"
        style="background:#222;"
        onclick="discardPhoto()"
      >
        ❌ Descartar
      </button>


      <button
        class="btn-side"
        style="
          background:#e63946;
          border:none;
        "
        onclick="downloadPhoto()"
      >
        💾 Guardar Evidencia
      </button>

    </div>

  </div>


  <!-- CANVAS OCULTO -->
  <canvas
    id="canvas"
    style="display:none;"
  ></canvas>


  <script>

    /* ========================================================
       ELEMENTOS
       ======================================================== */

    const video =
      document.getElementById('video-stream');

    const clockEl =
      document.getElementById('live-clock');

    let fileName = '';


    /* ========================================================
       RELOJ
       ======================================================== */

    function updateClock() {

      const now = new Date();


      const dateStr =
        now.toLocaleDateString(
          'es-MX',
          {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
          }
        );


      const timeStr =
        now.toLocaleTimeString(
          'es-MX',
          {
            hour: '2-digit',
            minute: '2-digit',
            hour12: true
          }
        );


      clockEl.innerText =
        `${dateStr} ${timeStr}`;

    }


    setInterval(updateClock, 1000);

    updateClock();


    /* ========================================================
       CÁMARA
       ======================================================== */

    navigator.mediaDevices
      .getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      })

      .then(stream => {

        video.srcObject = stream;

      })

      .catch(() => {

        navigator.mediaDevices
          .getUserMedia({
            video: true
          })
          .then(stream => {

            video.srcObject = stream;

          });

      });


    /* ========================================================
       TOMAR FOTOGRAFÍA
       ======================================================== */

    function takeSnapshot() {

      const canvas =
        document.getElementById('canvas');

      const ctx =
        canvas.getContext('2d');


      /*
       * ======================================================
       * FORMATO DE LA FOTO
       *
       * La referencia es aproximadamente 2:3.
       *
       * 800 x 1200
       * ======================================================
       */

      const outputW = 800;

      const outputH = 1200;


      canvas.width = outputW;

      canvas.height = outputH;


      /*
       * ======================================================
       * DATOS DEL VIDEO
       * ======================================================
       */

      const videoW =
        video.videoWidth || 1920;

      const videoH =
        video.videoHeight || 1080;


      /*
       * ======================================================
       * RECORTE VERTICAL
       *
       * El video de la cámara normalmente es horizontal.
       * Aquí se recorta al formato 2:3.
       * ======================================================
       */

      const targetRatio =
        outputW / outputH;

      const videoRatio =
        videoW / videoH;


      let sx;
      let sy;
      let sw;
      let sh;


      if (videoRatio > targetRatio) {

        /*
         * El video es más ancho.
         * Recortamos los lados.
         */

        sh = videoH;

        sw =
          videoH * targetRatio;

        sx =
          (videoW - sw) / 2;

        sy = 0;

      } else {

        /*
         * El video ya es vertical.
         */

        sw = videoW;

        sh =
          videoW / targetRatio;

        sx = 0;

        sy =
          (videoH - sh) / 2;

      }


      /*
       * Dibujar fotografía
       */

      ctx.drawImage(
        video,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        outputW,
        outputH
      );


      /* ======================================================
         TARJETA GPS
         ====================================================== */

      const margin =
        outputW * 0.035;


      const cardW =
        outputW - (margin * 2);


      /*
       * Exactamente 20% de la fotografía,
       * como en tu imagen de referencia.
       */

      const cardH =
        outputH * 0.20;


      const cardY =
        outputH -
        cardH -
        margin;


      /*
       * Fondo gris
       */

      ctx.fillStyle =
        "rgba(55, 61, 67, 0.92)";


      ctx.fillRect(
        margin,
        cardY,
        cardW,
        cardH
      );


      /*
       * Borde blanco
       */

      ctx.strokeStyle =
        "rgba(255, 255, 255, 0.75)";


      ctx.lineWidth = 2;


      ctx.strokeRect(
        margin,
        cardY,
        cardW,
        cardH
      );


      /* ======================================================
         CUADRO BLANCO DEL MAPA
         ====================================================== */

      const mapW =
        cardH * 0.76;


      const mapX =
        margin + 12;


      const mapY =
        cardY +
        (cardH - mapW) / 2;


      /*
       * Fondo blanco
       */

      ctx.fillStyle =
        "#ffffff";


      ctx.fillRect(
        mapX,
        mapY,
        mapW,
        mapW
      );


      /* ======================================================
         PIN
         ====================================================== */

      const centerX =
        mapX + mapW / 2;


      const centerY =
        mapY + mapW * 0.38;


      const radius =
        mapW * 0.22;


      /*
       * Cabeza roja
       */

      ctx.fillStyle =
        "#EA4335";


      ctx.beginPath();

      ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI * 2
      );

      ctx.fill();


      /*
       * Punta
       */

      ctx.beginPath();

      ctx.moveTo(
        centerX - radius,
        centerY + 3
      );

      ctx.lineTo(
        centerX,
        mapY + mapW * 0.75
      );

      ctx.lineTo(
        centerX + radius,
        centerY + 3
      );

      ctx.closePath();

      ctx.fill();


      /*
       * Centro blanco
       */

      ctx.fillStyle =
        "#ffffff";


      ctx.beginPath();

      ctx.arc(
        centerX,
        centerY,
        radius * 0.45,
        0,
        Math.PI * 2
      );

      ctx.fill();


      /* ======================================================
         TEXTO
         ====================================================== */

      const textX =
        mapX +
        mapW +
        14;


      /*
       * Tamaños
       */

      const fontSize =
        outputW * 0.021;


      let lineY =
        mapY +
        mapW * 0.16;


      /* ======================================================
         CABECERA
         ====================================================== */

      /*
       * Cuadro amarillo
       */

      ctx.fillStyle =
        "#fbc02d";


      ctx.fillRect(
        textX,
        lineY - 10,
        10,
        10
      );


      /*
       * Coyoacan GPS
       */

      ctx.fillStyle =
        "#ffffff";


      ctx.font =
        `bold ${fontSize * 1.05}px Arial, sans-serif`;


      ctx.textAlign =
        "left";


      ctx.fillText(
        "Coyoacan GPS",
        textX + 14,
        lineY
      );


      /*
       * Ciudad
       */

      ctx.textAlign =
        "right";


      ctx.fillText(
        "CMDX, Ciudad de Mexico, Mexico",
        margin + cardW - 12,
        lineY
      );


      ctx.textAlign =
        "left";


      /* ======================================================
         DIRECCIÓN
         ====================================================== */

      lineY +=
        mapW * 0.20;


      ctx.font =
        `${fontSize}px Arial, sans-serif`;


      ctx.fillStyle =
        "#e0e0e0";


      ctx.fillText(
        "Calle Centenario 123, Del Carmen,",
        textX,
        lineY
      );


      lineY +=
        mapW * 0.18;


      ctx.fillText(
        "Coyoacan",
        textX,
        lineY
      );


      /* ======================================================
         COORDENADAS
         ====================================================== */

      lineY +=
        mapW * 0.18;


      ctx.fillStyle =
        "#cccccc";


      ctx.fillText(
        "Lat 19.351234, Long -99.165678",
        textX,
        lineY
      );


      /* ======================================================
         FECHA Y HORA
         ====================================================== */

      lineY +=
        mapW * 0.20;


      const now =
        new Date();


      /*
       * Nombre del archivo
       */

      fileName =
        `Evidencia_${now
          .toISOString()
          .replace(/[:.]/g, '-')}.jpg`;


      const dateStr =
        now.toLocaleDateString(
          'es-MX',
          {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
          }
        );


      const timeStr =
        now.toLocaleTimeString(
          'es-MX',
          {
            hour: '2-digit',
            minute: '2-digit',
            hour12: true
          }
        );


      ctx.font =
        `bold ${fontSize * 1.05}px Arial, sans-serif`;


      ctx.fillStyle =
        "#ffffff";


      ctx.fillText(
        `${dateStr} ${timeStr}`,
        textX,
        lineY
      );


      /* ======================================================
         PIE
         ====================================================== */

      lineY +=
        mapW * 0.16;


      ctx.font =
        `${fontSize * 0.9}px Arial, sans-serif`;


      ctx.fillStyle =
        "#aaaaaa";


      ctx.fillText(
        "Foto tomada por Coyoacan GPS",
        textX,
        lineY
      );


      /* ======================================================
         MOSTRAR PREVISUALIZACIÓN
         ====================================================== */

      document
        .getElementById('preview-img')
        .src =
        canvas.toDataURL(
          'image/jpeg',
          0.95
        );


      document
        .getElementById('preview-modal')
        .style.display =
        'flex';

    }


    /* ========================================================
       DESCARTAR
       ======================================================== */

    function discardPhoto() {

      document
        .getElementById('preview-modal')
        .style.display =
        'none';

    }


    /* ========================================================
       GUARDAR
       ======================================================== */

    function downloadPhoto() {

      const a =
        document.createElement('a');


      a.href =
        document
          .getElementById('preview-img')
          .src;


      a.download =
        fileName;


      a.click();


      discardPhoto();

    }

  </script>

</body>
</html>

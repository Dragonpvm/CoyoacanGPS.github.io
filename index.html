<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Coyoacán GPS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body { 
      width: 100%; 
      height: 100dvh; 
      background: #000; 
      font-family: system-ui, -apple-system, sans-serif; 
      overflow: hidden; 
    }
    
    .app-viewport { 
      display: flex; 
      flex-direction: column; 
      width: 100%; 
      height: 100dvh; 
    }
    
    .camera-container { 
      position: relative; 
      flex: 1; 
      width: 100%; 
      background: #000; 
      overflow: hidden; 
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    
    /* BANNER ESTILO GPS MAP CAMERA (Semi-transparente + Mapa a la Izq) */
    .gps-banner {
      position: absolute; 
      bottom: 12px; 
      left: 10px; 
      right: 10px;
      background: rgba(0, 0, 0, 0.68); /* Caja negra semi-transparente */
      border-radius: 12px; 
      padding: 12px;
      display: flex; 
      align-items: center; 
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 10;
    }
    
    /* Mapa simulado en lado izquierdo */
    .gps-map-box { 
      width: 85px; 
      height: 85px; 
      background: #2a3a40 url('https://tile.openstreetmap.org/19/146865/241852.png') center/cover no-repeat;
      border-radius: 8px; 
      border: 2px solid #ffffff;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      flex-shrink: 0; 
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .gps-map-pin {
      font-size: 24px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }
    
    /* Contenedor de Textos Pegados y Legibles */
    .gps-info { 
      color: #fff; 
      display: flex;
      flex-direction: column;
      gap: 2px; /* Textos más pegados */
      flex: 1;
    }

    .brand-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: #ddd;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .city-title { 
      font-size: 1.15rem; 
      font-weight: 800; 
      color: #ffffff; 
      line-height: 1.15;
    }

    .address-text {
      font-size: 0.82rem;
      color: #e0e0e0;
      line-height: 1.15;
    }

    .coords-text {
      font-size: 0.8rem;
      color: #cccccc;
      font-weight: 500;
    }

    .clock-text {
      color: #4cc9f0;
      font-weight: 700;
      font-size: 0.85rem;
    }
    
    /* Controles Inferiores */
    .controls-panel { 
      height: 105px; 
      min-height: 105px;
      background: #0d0d0d; 
      display: flex; 
      justify-content: space-evenly; 
      align-items: center; 
      padding: 0 16px; 
      border-top: 1px solid #222;
      z-index: 20;
    }
    
    .btn-side { 
      background: #1f1f1f; 
      color: #fff; 
      border: 1px solid #333; 
      padding: 10px 16px; 
      border-radius: 10px; 
      font-size: 0.85rem; 
      font-weight: 600; 
      cursor: pointer;
    }
    
    .btn-capture { 
      width: 72px; 
      height: 72px; 
      border-radius: 50%; 
      background: #ffffff; 
      border: 5px solid #e63946; 
      cursor: pointer; 
      box-shadow: 0 0 15px rgba(230, 57, 70, 0.4);
    }

    #preview-modal { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: #000; 
      z-index: 100; 
      flex-direction: column; 
    }
    
    #preview-img { 
      width: 100%; 
      flex: 1; 
      object-fit: contain; 
      background: #000; 
    }
    
    .preview-actions { 
      height: 95px; 
      background: #0d0d0d; 
      display: flex; 
      justify-content: space-evenly; 
      align-items: center; 
      border-top: 1px solid #222;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="camera-container">
      <video id="video-stream" autoplay playsinline muted></video>
      
      <!-- BANNER ACTUALIZADO CON ESTRUCTURA EXACTA -->
      <div class="gps-banner">
        <!-- Mapa Izquierdo -->
        <div class="gps-map-box">
          <span class="gps-map-pin">📍</span>
        </div>

        <!-- Textos Ordenados -->
        <div class="gps-info">
          <div class="brand-tag">📷 Coyoacán GPS</div>
          <div class="city-title">CDMX, Ciudad de México, México</div>
          <div class="address-text">Calle Centenario 123, Del Carmen, Coyoacán</div>
          <div class="coords-text">Lat 19.351234, Long -99.165678</div>
          <div class="clock-text" id="live-clock">Cargando...</div>
        </div>
      </div>
    </div>

    <div class="controls-panel">
      <button class="btn-side" onclick="alert('Modo video')">📹 Video</button>
      <button class="btn-capture" onclick="takeSnapshot()"></button>
      <button class="btn-side" onclick="alert('Galería')">🖼️ Galería</button>
    </div>
  </div>

  <div id="preview-modal">
    <img id="preview-img" alt="Vista previa">
    <div class="preview-actions">
      <button class="btn-side" style="background: #2a2a2a;" onclick="discardPhoto()">❌ Descartar</button>
      <button class="btn-side" style="background: #e63946; border: none; font-size: 0.95rem;" onclick="downloadPhoto()">💾 Guardar Evidencia</button>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video-stream');
    const clockEl = document.getElementById('live-clock');
    let fileName = '';

    function updateClock() {
      const now = new Date();
      clockEl.innerText = now.toLocaleString('es-MX');
    }
    setInterval(updateClock, 1000);
    updateClock();

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
    }).catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true }).then(stream => video.srcObject = stream);
    });

    function takeSnapshot() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      const width = video.videoWidth || 1280;
      const height = video.videoHeight || 720;
      canvas.width = width;
      canvas.height = height;

      // 1. Dibujar Foto de fondo
      ctx.drawImage(video, 0, 0, width, height);

      // 2. Dibujar Caja Negra Semi-transparente
      const margin = width * 0.025;
      const bannerHeight = height * 0.24;
      const bannerWidth = width - (margin * 2);
      const bannerY = height - bannerHeight - margin;

      ctx.fillStyle = "rgba(0, 0, 0, 0.70)";
      ctx.roundRect(margin, bannerY, bannerWidth, bannerHeight, 14);
      ctx.fill();

      // 3. Dibujar Cuadro del Mapa (Izquierda)
      const mapSize = bannerHeight * 0.75;
      const mapX = margin + 15;
      const mapY = bannerY + (bannerHeight - mapSize) / 2;

      ctx.fillStyle = "#2a3a40";
      ctx.roundRect(mapX, mapY, mapSize, mapSize, 8);
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Pin del Mapa
      ctx.fillStyle = "#e63946";
      ctx.font = `${mapSize * 0.4}px sans-serif`;
      ctx.fillText("📍", mapX + (mapSize * 0.28), mapY + (mapSize * 0.65));

      // 4. Dibujar Textos Ordenados
      const textX = mapX + mapSize + 18;
      let currentY = bannerY + (bannerHeight * 0.20);

      // Marca de agua
      ctx.fillStyle = "#cccccc";
      ctx.font = `bold ${width * 0.022}px sans-serif`;
      ctx.fillText("📷 COYOACÁN GPS", textX, currentY);

      // Título Ciudad (Grande)
      currentY += (bannerHeight * 0.20);
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${width * 0.032}px sans-serif`;
      ctx.fillText("CDMX, Ciudad de México, México", textX, currentY);

      // Dirección
      currentY += (bannerHeight * 0.18);
      ctx.fillStyle = "#dddddd";
      ctx.font = `${width * 0.024}px sans-serif`;
      ctx.fillText("Calle Centenario 123, Del Carmen, Coyoacán", textX, currentY);

      // Coordenadas
      currentY += (bannerHeight * 0.17);
      ctx.fillStyle = "#bbbbbb";
      ctx.font = `${width * 0.023}px sans-serif`;
      ctx.fillText("Lat 19.351234, Long -99.165678", textX, currentY);

      // Fecha y Hora
      currentY += (bannerHeight * 0.18);
      const now = new Date();
      fileName = `Evidencia_${now.toISOString().replace(/[:.]/g, '-')}.jpg`;
      ctx.fillStyle = "#4cc9f0";
      ctx.font = `bold ${width * 0.025}px sans-serif`;
      ctx.fillText(now.toLocaleString('es-MX'), textX, currentY);

      // Mostrar Vista Previa
      document.getElementById('preview-img').src = canvas.toDataURL('image/jpeg', 0.95);
      document.getElementById('preview-modal').style.display = 'flex';
    }

    function discardPhoto() {
      document.getElementById('preview-modal').style.display = 'none';
    }

    function downloadPhoto() {
      const a = document.createElement('a');
      a.href = document.getElementById('preview-img').src;
      a.download = fileName;
      a.click();
      discardPhoto();
    }
  </script>
</body>
</html>

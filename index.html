<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Coyoacán GPS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    /* Layout dinámico adaptable a cualquier resolución */
    html, body { 
      width: 100%; 
      height: 100dvh; /* dvh se adapta a la altura real descontando la barra de Chrome */
      background: #000; 
      font-family: system-ui, -apple-system, sans-serif; 
      overflow: hidden; 
    }
    
    .app-viewport { 
      display: flex; 
      flex-direction: column; 
      width: 100%; 
      height: 100dvh; 
    }
    
    /* Zona del stream de Cámara */
    .camera-container { 
      position: relative; 
      flex: 1; 
      width: 100%; 
      background: #000; 
      overflow: hidden; 
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    
    /* Banner GPS Legible y Escalable */
    .gps-banner {
      position: absolute; 
      bottom: 15px; 
      left: 12px; 
      right: 12px;
      background: rgba(0, 0, 0, 0.85); 
      border-radius: 14px; 
      padding: 14px 16px;
      display: flex; 
      align-items: center; 
      gap: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      z-index: 10;
    }
    
    .gps-pin { 
      width: 44px; 
      height: 44px; 
      background: #e63946; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 22px; 
      flex-shrink: 0; 
    }
    
    .gps-info { 
      color: #eee; 
      font-size: 0.85rem; 
      line-height: 1.35; 
      flex: 1;
    }
    
    .gps-info strong { 
      font-size: 1.05rem; 
      color: #fff; 
      display: block; 
      margin-bottom: 2px; 
    }

    .gps-info .clock {
      color: #4cc9f0;
      font-weight: 700;
      font-size: 0.9rem;
    }
    
    /* Controles Inferiores Fijos (Estilo GPS Map Camera) */
    .controls-panel { 
      height: 110px; 
      min-height: 110px;
      background: #0d0d0d; 
      display: flex; 
      justify-content: space-evenly; 
      align-items: center; 
      padding: 0 16px; 
      border-top: 1px solid #222;
      z-index: 20;
    }
    
    .btn-side { 
      background: #1f1f1f; 
      color: #fff; 
      border: 1px solid #333; 
      padding: 12px 18px; 
      border-radius: 12px; 
      font-size: 0.85rem; 
      font-weight: 600; 
      cursor: pointer;
    }
    
    .btn-capture { 
      width: 74px; 
      height: 74px; 
      border-radius: 50%; 
      background: #ffffff; 
      border: 6px solid #e63946; 
      cursor: pointer; 
      box-shadow: 0 0 15px rgba(230, 57, 70, 0.4);
    }
    
    .btn-capture:active { 
      transform: scale(0.92); 
      background: #ccc; 
    }

    /* Modal de Previsualización antes de Guardar */
    #preview-modal { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: #000; 
      z-index: 100; 
      flex-direction: column; 
    }
    
    #preview-img { 
      width: 100%; 
      flex: 1; 
      object-fit: contain; 
      background: #000; 
    }
    
    .preview-actions { 
      height: 100px; 
      background: #0d0d0d; 
      display: flex; 
      justify-content: space-evenly; 
      align-items: center; 
      border-top: 1px solid #222;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <!-- CÁMARA + BANNER -->
    <div class="camera-container">
      <video id="video-stream" autoplay playsinline muted></video>
      
      <div class="gps-banner">
        <div class="gps-pin">📍</div>
        <div class="gps-info">
          <strong>Coyoacán GPS</strong>
          CDMX, Ciudad de México, México<br>
          Calle Centenario 123, Del Carmen, Coyoacán<br>
          Lat 19.351234, Long -99.165678<br>
          <span class="clock" id="live-clock">Sincronizando reloj...</span>
        </div>
      </div>
    </div>

    <!-- PANEL INFERIOR FIJO -->
    <div class="controls-panel">
      <button class="btn-side" onclick="alert('Opción de video')">📹 Video</button>
      <button class="btn-capture" onclick="takeSnapshot()"></button>
      <button class="btn-side" onclick="alert('Visor de Galería')">🖼️ Galería</button>
    </div>
  </div>

  <!-- PREVISUALIZACIÓN -->
  <div id="preview-modal">
    <img id="preview-img" alt="Vista previa de evidencia">
    <div class="preview-actions">
      <button class="btn-side" style="background: #2a2a2a;" onclick="discardPhoto()">❌ Descartar</button>
      <button class="btn-side" style="background: #e63946; border: none; font-size: 0.95rem;" onclick="downloadPhoto()">💾 Guardar Evidencia</button>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video-stream');
    const clockEl = document.getElementById('live-clock');
    let fileName = '';

    // Actualizador de reloj
    function updateClock() {
      const now = new Date();
      clockEl.innerText = now.toLocaleString('es-MX');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Iniciar cámara trasera nativa
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
    }).catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true }).then(stream => video.srcObject = stream);
    });

    // Procesamiento de la Foto con Marca de Agua
    function takeSnapshot() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      const width = video.videoWidth || 1280;
      const height = video.videoHeight || 720;
      canvas.width = width;
      canvas.height = height;

      // 1. Dibujar cuadro de video
      ctx.drawImage(video, 0, 0, width, height);

      // 2. Banner Proporcional HD
      const margin = width * 0.03;
      const bannerHeight = height * 0.22; // Altura adaptativa
      const bannerWidth = width - (margin * 2);
      const bannerY = height - bannerHeight - margin;

      ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
      ctx.roundRect(margin, bannerY, bannerWidth, bannerHeight, width * 0.02);
      ctx.fill();

      // Textos legibles en alta resolución
      const baseFontSize = width * 0.028;
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${baseFontSize * 1.3}px sans-serif`;
      ctx.fillText("Coyoacán GPS", margin + (width * 0.03), bannerY + (bannerHeight * 0.28));
      
      ctx.font = `${baseFontSize}px sans-serif`;
      ctx.fillStyle = "#dddddd";
      ctx.fillText("CDMX, Ciudad de México, México - Calle Centenario 123", margin + (width * 0.03), bannerY + (bannerHeight * 0.52));
      ctx.fillText("Lat 19.351234, Long -99.165678", margin + (width * 0.03), bannerY + (bannerHeight * 0.72));
      
      const now = new Date();
      fileName = `Evidencia_${now.toISOString().replace(/[:.]/g, '-')}.jpg`;
      ctx.fillStyle = "#4cc9f0";
      ctx.fillText(now.toLocaleString('es-MX'), margin + (width * 0.03), bannerY + (bannerHeight * 0.90));

      // 3. Abrir visor de previsualización
      document.getElementById('preview-img').src = canvas.toDataURL('image/jpeg', 0.95);
      document.getElementById('preview-modal').style.display = 'flex';
    }

    function discardPhoto() {
      document.getElementById('preview-modal').style.display = 'none';
    }

    function downloadPhoto() {
      const a = document.createElement('a');
      a.href = document.getElementById('preview-img').src;
      a.download = fileName;
      a.click();
      discardPhoto();
    }
  </script>
</body>
</html>

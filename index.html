<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Coyoacán GPS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body { 
      width: 100%; 
      height: 100dvh; 
      background: #000; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      overflow: hidden; 
    }
    
    .app-viewport { 
      display: flex; 
      flex-direction: column; 
      width: 100%; 
      height: 100dvh; 
    }
    
    .camera-container { 
      position: relative; 
      flex: 1; 
      width: 100%; 
      background: #000; 
      overflow: hidden; 
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    
    /* CAJA NEGRA SEMI-TRANSPARENTE CON MARCO DELGADO */
    .gps-box {
      position: absolute; 
      bottom: 16px; 
      left: 12px; 
      right: 12px;
      background: rgba(0, 0, 0, 0.78); /* Negro transparente */
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 10;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    /* CUADRO DEL MAPA EN LA IZQUIERDA */
    .map-square {
      width: 90px;
      height: 90px;
      min-width: 90px;
      background: #ffffff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-pin {
      font-size: 45px;
      line-height: 1;
    }

    /* COLUMNA DE TEXTOS ORDENADOS EN JERARQUÍA STRICTA */
    .info-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px; /* Letras un poco más pegadas */
      color: #ffffff;
    }

    /* 1. Marca de agua (logo) Coyoacán GPS */
    .watermark-text {
      font-size: 11px;
      font-weight: 600;
      color: #b0b0b0;
      display: flex;
      align-items: center;
      gap: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .yellow-icon {
      width: 10px;
      height: 10px;
      background: #fbc02d;
      border-radius: 2px;
      display: inline-block;
    }

    /* 2. Título, ciudad, País (Grande) */
    .city-title-large {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.15;
      margin-bottom: 1px;
    }

    /* 3. Dirección */
    .address-text {
      font-size: 12px;
      font-weight: 500;
      color: #e0e0e0;
      line-height: 1.15;
    }

    /* 4. Coordenadas */
    .coords-text {
      font-size: 11px;
      color: #cccccc;
    }

    /* 5. Fecha y hora */
    .datetime-text {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 1px;
    }

    /* CONTROLES INFERIORES */
    .controls-panel { 
      height: 95px; 
      min-height: 95px;
      background: #0a0a0a; 
      display: flex; 
      justify-content: space-evenly; 
      align-items: center; 
      border-top: 1px solid #222;
      z-index: 20;
    }
    
    .btn-side { 
      background: #1a1a1a; 
      color: #fff; 
      border: 1px solid #333; 
      padding: 9px 15px; 
      border-radius: 8px; 
      font-size: 0.8rem; 
      font-weight: 600; 
      cursor: pointer;
    }
    
    .btn-capture { 
      width: 66px; 
      height: 66px; 
      border-radius: 50%; 
      background: #ffffff; 
      border: 4px solid #e63946; 
      cursor: pointer; 
    }

    #preview-modal { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: #000; 
      z-index: 100; 
      flex-direction: column; 
    }
    
    #preview-img { 
      width: 100%; 
      flex: 1; 
      object-fit: contain; 
      background: #000; 
    }
    
    .preview-actions { 
      height: 85px; 
      background: #0a0a0a; 
      display: flex; 
      justify-content: space-evenly; 
      align-items: center; 
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="camera-container">
      <video id="video-stream" autoplay playsinline muted></video>
      
      <!-- CUADRO NEGRO CON ESTRUCTURA CORREGIDA -->
      <div class="gps-box">
        <!-- Mapa en lado izquierdo -->
        <div class="map-square">
          <span class="map-pin">📍</span>
        </div>

        <!-- Textos en columna derecha -->
        <div class="info-column">
          <!-- 1. Marca de Agua -->
          <div class="watermark-text">
            <span class="yellow-icon"></span> Coyoacan GPS
          </div>

          <!-- 2. Título Grande de Ciudad -->
          <div class="city-title-large">CDMX, Ciudad de México, México</div>

          <!-- 3. Dirección -->
          <div class="address-text">Calle Centenario 123, Del Carmen, Coyoacán</div>

          <!-- 4. Coordenadas -->
          <div class="coords-text">Lat 19.351234, Long -99.165678</div>

          <!-- 5. Fecha y Hora -->
          <div class="datetime-text" id="live-clock">14/9/2026, 9:25:17 a.m.</div>
        </div>
      </div>
    </div>

    <div class="controls-panel">
      <button class="btn-side" onclick="alert('Modo video')">📹 Video</button>
      <button class="btn-capture" onclick="takeSnapshot()"></button>
      <button class="btn-side" onclick="alert('Galería')">🖼️ Galería</button>
    </div>
  </div>

  <div id="preview-modal">
    <img id="preview-img" alt="Evidencia">
    <div class="preview-actions">
      <button class="btn-side" style="background: #222;" onclick="discardPhoto()">❌ Descartar</button>
      <button class="btn-side" style="background: #e63946; border: none;" onclick="downloadPhoto()">💾 Guardar Evidencia</button>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video-stream');
    const clockEl = document.getElementById('live-clock');
    let fileName = '';

    function updateClock() {
      const now = new Date();
      clockEl.innerText = now.toLocaleString('es-MX');
    }
    setInterval(updateClock, 1000);
    updateClock();

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
    }).catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true }).then(stream => video.srcObject = stream);
    });

    function takeSnapshot() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      const w = video.videoWidth || 1280;
      const h = video.videoHeight || 720;
      canvas.width = w;
      canvas.height = h;

      // 1. Dibujar Foto original
      ctx.drawImage(video, 0, 0, w, h);

      // 2. Dibujar Caja Negra Semi-transparente
      const margin = w * 0.03;
      const boxW = w - (margin * 2);
      const boxH = h * 0.20;
      const boxY = h - boxH - margin;

      ctx.fillStyle = "rgba(0, 0, 0, 0.78)";
      ctx.fillRect(margin, boxY, boxW, boxH);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(margin, boxY, boxW, boxH);

      // 3. Cuadro blanco del Mapa (Izquierda)
      const mapW = boxH * 0.75;
      const mapX = margin + 12;
      const mapY = boxY + (boxH - mapW) / 2;

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(mapX, mapY, mapW, mapW);

      // Pin
      ctx.fillStyle = "#e63946";
      ctx.font = `${mapW * 0.65}px sans-serif`;
      ctx.fillText("📍", mapX + (mapW * 0.18), mapY + (mapW * 0.78));

      // 4. Renderizar Textos en el MISMO ORDEN que la pantalla
      const textX = mapX + mapW + 14;
      const baseFontSize = w * 0.022;

      // Línea 1: Marca de Agua
      let currentY = mapY + (mapW * 0.16);
      ctx.fillStyle = "#fbc02d";
      ctx.fillRect(textX, currentY - (baseFontSize * 0.6), baseFontSize * 0.6, baseFontSize * 0.6);

      ctx.fillStyle = "#b0b0b0";
      ctx.font = `bold ${baseFontSize * 0.8}px sans-serif`;
      ctx.fillText("COYOACÁN GPS", textX + (baseFontSize * 0.8), currentY);

      // Línea 2: Título Ciudad (Grande)
      currentY += (mapW * 0.22);
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${baseFontSize * 1.3}px sans-serif`;
      ctx.fillText("CDMX, Ciudad de México, México", textX, currentY);

      // Línea 3: Dirección
      currentY += (mapW * 0.20);
      ctx.fillStyle = "#e0e0e0";
      ctx.font = `${baseFontSize * 0.95}px sans-serif`;
      ctx.fillText("Calle Centenario 123, Del Carmen, Coyoacán", textX, currentY);

      // Línea 4: Coordenadas
      currentY += (mapW * 0.18);
      ctx.fillStyle = "#cccccc";
      ctx.font = `${baseFontSize * 0.85}px sans-serif`;
      ctx.fillText("Lat 19.351234, Long -99.165678", textX, currentY);

      // Línea 5: Fecha y Hora
      currentY += (mapW * 0.20);
      const now = new Date();
      fileName = `Evidencia_${now.toISOString().replace(/[:.]/g, '-')}.jpg`;
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${baseFontSize * 0.95}px sans-serif`;
      ctx.fillText(now.toLocaleString('es-MX'), textX, currentY);

      // Abrir modal
      document.getElementById('preview-img').src = canvas.toDataURL('image/jpeg', 0.95);
      document.getElementById('preview-modal').style.display = 'flex';
    }

    function discardPhoto() {
      document.getElementById('preview-modal').style.display = 'none';
    }

    function downloadPhoto() {
      const a = document.createElement('a');
      a.href = document.getElementById('preview-img').src;
      a.download = fileName;
      a.click();
      discardPhoto();
    }
  </script>
</body>
</html>
